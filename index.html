<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Juegos educativos accesibles para Infantil y Primaria"><title>Aula de Aventuras</title><style>
*{box-sizing:border-box}body{margin:0;font:18px/1.55 system-ui,sans-serif;background:#fbf9ff;color:#302b48}button,input,select{font:inherit;color:inherit}button,select,input{border:2px solid #d9d3e8;border-radius:13px;padding:12px;background:white}button{cursor:pointer;font-weight:700;min-height:48px}button:hover{border-color:#7654b4;background:#f2ebff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7546ad;outline-offset:3px}button:disabled{opacity:.6;cursor:default}header{background:white;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(4%,calc((100% - 1100px)/2));border-bottom:1px solid #e9e2f2}.brand{font-weight:850;font-size:21px}main{max-width:1100px;margin:auto;padding:26px 20px 50px}.hero{background:linear-gradient(125deg,#e9dcfa,#fce2eb 55%,#d5f3e9);border-radius:30px;padding:32px 20px;text-align:center}h1{font-size:clamp(30px,5vw,52px);line-height:1.15;margin:12px 0}h2{line-height:1.2}.tag,.pill{font-size:14px;font-weight:800;background:#fff9;border-radius:99px;padding:7px 13px;display:inline-block}.big{font-size:62px;line-height:1.1}.filters,.options,.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.filters{margin:20px 0}.filters label{display:grid;flex:1;min-width:145px;font-size:14px;font-weight:700;gap:4px}.filters input,.filters select{width:100%;font-size:17px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:20px}.card,.panel{border:1px solid #e5deef;border-radius:22px;background:white;padding:24px;box-shadow:0 6px 22px #3b27590a}.sea{background:#e3effa}.pink{background:#fce6ed}.mint{background:#dff3e9}.primary{background:#64429a;color:white;border-color:#64429a}.primary:hover{background:#4d2b80;color:white}.wide{width:100%;margin-top:10px}.muted{color:#625b75;font-size:15px}.section{margin:28px 0 12px}.panel{margin-top:18px}.question{font-size:clamp(22px,4vw,34px);font-weight:800;margin:20px 0}.options button{flex:1;min-width:100px;font-size:22px;padding:16px}.feedback{margin:16px 0;min-height:30px;font-weight:700}.good{color:#146344}.bad{color:#9d4414}.rule{background:#f3ecff;border-radius:15px;padding:16px;margin:10px 0}.progress{height:12px;border-radius:10px;background:#e9e4f1;overflow:hidden}.progress span{display:block;background:#6e50a2;height:100%}.board{display:grid;gap:7px;justify-content:center;margin:18px auto;font-size:25px;align-items:center;text-align:center}.cell{width:clamp(45px,13vw,68px);height:58px;text-align:center;padding:4px;font-size:27px;font-weight:750}.smallcell{height:40px;font-size:18px;background:#fff4d6;border:2px dashed #a17b22}.digit{font-weight:800}.line{border-top:3px solid #302b48;height:1px}.boardlabel{font-size:12px;color:#625b75;text-align:center}footer{text-align:center;padding:25px 16px;color:#635b72;font-size:14px;border-top:1px solid #e9e2f2}[hidden]{display:none!important}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;padding:12px;z-index:5}@media(max-width:480px){main{padding:15px 12px}.panel,.card{padding:16px}.hero{padding:24px 12px}.brand{font-size:17px}}
</style><style>.sheet-link,.sheet-actions a{display:inline-block;padding:10px 14px;color:#523480;font-weight:700;border-radius:12px;background:#f2ebff}.sheet-actions{display:flex;flex-wrap:wrap;gap:12px}.sheet-actions .primary{color:white;background:#64429a}header{flex-wrap:wrap}header nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}a:focus-visible{outline:3px solid #7546ad;outline-offset:3px}</style></head><body><a class="skip" href="#app">Saltar al contenido</a><header><span class="brand">🌈 Aula de Aventuras</span><nav aria-label="Secciones"><a class="sheet-link" href="./fichas-adaptadas.html">Fichas adaptadas</a><button id="home">🏠 Inicio</button></nav></header><main id="app" tabindex="-1"></main><footer>© 2026 Patricia Cárcamo · Aula de Aventuras · Todos los derechos reservados.<br>Aprendizaje accesible. No se solicitan ni almacenan datos personales del alumnado.</footer>
<script>
'use strict';
const app=document.getElementById('app'),games=[{id:'invertebrados',icon:'🪼',title:'Exploradores de los invertebrados',course:'3.º',stage:'Primaria',area:'Conocimiento del medio',color:'sea',desc:'Descubre seis grandes grupos de invertebrados. Aprende con fichas y audio, practica con huecos, flechas, respuestas cortas y test, y repasa tus errores.'},{id:'tilde',icon:'🔎',title:'Misión Tilde',course:'5.º',stage:'Primaria',area:'Lengua',color:'pink',desc:'Descubre la sílaba tónica, clasifica palabras y supera el reto de las tildes.'},{id:'math',icon:'🚀',title:'La aventura de las operaciones',course:'2.º',stage:'Primaria',area:'Matemáticas',color:'mint',desc:'Practica sumas, restas y problemas con ayudas paso a paso.'},{id:'tren',icon:'🚂',title:'El tren de las palabras',course:'4.º',stage:'Primaria',area:'Lengua',color:'mint',desc:'Practica la segmentación léxica: cuenta palabras, marca espacios y ordena vagones con pistas visuales y lectura en voz alta.'},{id:'puerto',icon:'⛵',title:'El puerto de las letras',course:'4.º',stage:'Primaria',area:'Lengua',color:'sea',desc:'Aprende a distinguir la b y la d con seis juegos de discriminación visual, pistas de color y lectura en voz alta.'}];
const el=id=>document.getElementById(id);
function view(s){app.innerHTML=s;app.focus();window.scrollTo(0,0)}
function home(){view('<section class="hero"><div class="big">🌈 ✨</div><span class="tag">RECURSOS EDUCATIVOS INTERACTIVOS</span><h1>Aula de Aventuras</h1><p>Aprende, juega y descubre a tu ritmo.</p></section><h2 class="section">Encuentra tu juego</h2><div class="filters"><label>Buscar<input id="search" type="search" placeholder="Ej.: tildes, sumas..."></label><label>Etapa<select id="stage"><option value="">Todas</option><option>Infantil</option><option>Primaria</option></select></label><label>Curso<select id="course"><option value="">Todos</option><option>3 años</option><option>4 años</option><option>5 años</option><option>1.º</option><option>2.º</option><option>3.º</option><option>4.º</option><option>5.º</option><option>6.º</option></select></label><label>Materia<select id="area"><option value="">Todas</option><option>Lengua</option><option>Matemáticas</option><option>Conocimiento del medio</option><option>Funciones ejecutivas</option><option>Habilidades sociales</option></select></label></div><div class="cards" id="catalog"></div><p class="muted">Próximamente, nuevas aventuras para Infantil y Primaria.</p>');const normal=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');function draw(){const s=normal(el('search').value),stage=el('stage').value,course=el('course').value,area=el('area').value;const list=games.filter(g=>(!s||normal(g.title+' '+g.desc+' '+g.area).includes(s))&&(!stage||stage===g.stage)&&(!course||course===g.course)&&(!area||area===g.area));el('catalog').innerHTML=list.length?list.map(g=>'<article class="card '+g.color+'"><div class="big">'+g.icon+'</div><span class="pill">'+g.course+' '+g.stage+' · '+g.area+'</span><h2>'+g.title+'</h2><p>'+g.desc+'</p><button class="primary wide" data-game="'+g.id+'">Jugar</button></article>').join(''):'<p>No hay juegos en esta selección todavía. Prueba otros filtros.</p>';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{if(b.dataset.game==='invertebrados'){window.location.assign('./exploradores-invertebrados.html');return}if(b.dataset.game==='tren'){window.location.assign('./el-tren-de-las-palabras.html');return}if(b.dataset.game==='puerto'){window.location.assign('./puerto-de-las-letras.html');return}if(b.dataset.game==='tilde')tildeIntro();else mathIntro()})}document.querySelectorAll('.filters input,.filters select').forEach(x=>x.addEventListener('input',draw));draw()}
el('home').onclick=home;
const sy=[['camisa',['ca','mi','sa'],1],['música',['mú','si','ca'],0],['reloj',['re','loj'],1],['pelota',['pe','lo','ta'],1],['árbol',['ár','bol'],0],['teléfono',['te','lé','fo','no'],1],['camión',['ca','mión'],1],['mariposa',['ma','ri','po','sa'],2],['pájaro',['pá','ja','ro'],0],['papel',['pa','pel'],1],['lápiz',['lá','piz'],0],['corazón',['co','ra','zón'],2]];
const cl=[['café','Aguda'],['mesa','Llana'],['médico','Esdrújula'],['ratón','Aguda'],['azúcar','Llana'],['brújula','Esdrújula'],['pared','Aguda'],['casa','Llana'],['plátano','Esdrújula'],['jardín','Aguda'],['fácil','Llana'],['sábado','Esdrújula']];
const ac=[['canción','cancion','Aguda terminada en n.'],['papel','papél','Aguda terminada en l: no lleva tilde.'],['lápiz','lapiz','Llana terminada en z.'],['casa','cása','Llana terminada en vocal: no lleva tilde.'],['música','musica','Las esdrújulas siempre llevan tilde.'],['camión','camion','Aguda terminada en n.'],['árbol','arbol','Llana terminada en l.'],['reloj','relój','Aguda terminada en j: no lleva tilde.'],['pájaro','pajaro','Las esdrújulas siempre llevan tilde.'],['compás','compas','Aguda terminada en s.']];
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const qS=x=>({p:'¿Cuál es la sílaba tónica de '+x[0]+'?',opts:x[1],a:x[1][x[2]],why:'La sílaba más fuerte es '+x[1][x[2]]+'.'}),qC=x=>({p:'¿Qué tipo de palabra es «'+x[0]+'»?',opts:['Aguda','Llana','Esdrújula'],a:x[1],why:'Es '+x[1].toLowerCase()+'.'}),qA=x=>({p:'Elige la palabra escrita correctamente.',opts:shuffle([x[0],x[1]]),a:x[0],why:x[2]});
function tildeIntro(){view('<span class="pill">Lengua · 5.º Primaria</span><h1>🔎 Misión Tilde</h1><section class="panel"><h2>Aprende antes de jugar</h2><p>La sílaba tónica es la que pronunciamos con más fuerza: ca-<b>MI</b>-sa.</p><div class="rule"><b>Agudas:</b> última sílaba. Llevan tilde si terminan en vocal, n o s (por ejemplo, ca-fé).</div><div class="rule"><b>Llanas:</b> penúltima sílaba. Por regla general, llevan tilde si no terminan en vocal, n o s (por ejemplo, lá-piz).</div><div class="rule"><b>Esdrújulas:</b> antepenúltima sílaba. Siempre llevan tilde (por ejemplo, mú-si-ca).</div><p class="muted">Practicamos las reglas generales con palabras sin excepciones.</p></section><section class="panel"><h2>Elige tu misión</h2><div class="options"><button data-level="0">1. Sílaba tónica</button><button data-level="1">2. Clasificación</button><button data-level="2">3. Tildes</button><button class="primary" data-level="3">🏆 Reto final</button></div></section>');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startT(Number(b.dataset.level)))}
function startT(level){const sets=[sy.map(qS),cl.map(qC),ac.map(qA)],qs=level===3?shuffle(sets.flat()).slice(0,12):shuffle(sets[level]).slice(0,8);let i=0,score=0;function draw(){if(i===qs.length){finish(score,qs.length,()=>startT(level),tildeIntro);return}const q=qs[i];view('<span class="pill">Misión Tilde</span><h2>Pregunta '+(i+1)+' de '+qs.length+' · ⭐ '+score+'</h2><div class="progress" role="progressbar" aria-label="Progreso" aria-valuenow="'+i+'" aria-valuemax="'+qs.length+'"><span style="width:'+i/qs.length*100+'%"></span></div><section class="panel"><div class="question">'+q.p+'</div><div class="options">'+q.opts.map((o,j)=>'<button data-answer="'+j+'">'+o+'</button>').join('')+'</div><div id="feedback" class="feedback" role="status"></div><button id="next" class="primary wide" hidden>Siguiente</button><button id="help" class="wide">Ver recordatorio</button><div id="hint" class="rule" hidden>Agudas: última. Llanas: penúltima. Esdrújulas: antepenúltima. Escucha la palabra mentalmente y fíjate en cómo termina.</div></section>');el('help').onclick=()=>el('hint').hidden=!el('hint').hidden;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const correct=q.opts[Number(b.dataset.answer)]===q.a;if(correct)score++;el('feedback').className='feedback '+(correct?'good':'bad');el('feedback').textContent=(correct?'¡Muy bien! ':'La respuesta correcta es '+q.a+'. ')+q.why;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);el('next').hidden=false;el('next').focus()});el('next').onclick=()=>{i++;draw()}}draw()}
function finish(score,total,repeat,back){view('<section class="hero"><div class="big">🏆</div><h1>¡Aventura completada!</h1><h2>'+score+' de '+total+' aciertos a la primera</h2><p>Has practicado y aprendido. ¡Sigue avanzando a tu ritmo!</p><div class="options"><button id="repeat" class="primary">Volver a jugar</button><button id="back">Elegir actividad</button><button id="goHome">Inicio</button></div></section>');el('repeat').onclick=repeat;el('back').onclick=back;el('goHome').onclick=home}
function mathIntro(){view('<span class="pill">Matemáticas · 2.º Primaria</span><h1>🚀 La aventura de las operaciones</h1><section class="panel"><h2>Elige el nivel que necesitas</h2><p>Practica a tu ritmo. Puedes usar las casillas amarillas para recordar las llevadas.</p><div class="options"><button data-m="1">🌱 Nivel 1<br><small>Sin llevadas</small></button><button data-m="2">🌟 Nivel 2<br><small>Con llevadas</small></button><button data-m="3">🚀 Nivel 3<br><small>Tres cifras</small></button></div><h2>¿Qué quieres practicar?</h2><div class="options"><button data-type="sum">Sumas</button><button data-type="sub">Restas</button><button data-type="prob">Problemas</button><button data-type="mix">Mezclado</button></div><p id="selection" class="rule" role="status"></p><button id="start" class="primary wide">¡Empezar!</button></section>');let level=2,type='mix';function select(){document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.m)===level)));document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===type)));el('selection').textContent='Nivel '+level+' · '+({sum:'Sumas',sub:'Restas',prob:'Problemas',mix:'Mezclado'})[type];document.querySelectorAll('[aria-pressed]').forEach(b=>b.classList.toggle('primary',b.getAttribute('aria-pressed')==='true'))}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.m);select()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;select()});el('start').onclick=()=>startM(level,type);select()}
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function makeM(l,type,i){let sub=type==='sub'||((type==='mix'||type==='prob')&&i%2===1),a,b;const n=l===3?3:2;if(l===1){const x=rand(1,sub?9:8),y=rand(sub?0:1,sub?x:9-x),u=rand(0,sub?9:8),v=rand(0,sub?u:9-u);a=x*10+u;b=y*10+v}else{do{a=rand(n===3?100:10,n===3?999:99);b=rand(n===3?100:10,n===3?999:99);if(sub&&a<b)[a,b]=[b,a]}while(sub?(a%10>=b%10):(a%10+b%10<10))}let prob=type==='prob'||(type==='mix'&&i%3===2);return {a,b,sub,prob,n,res:sub?a-b:a+b}}
function startM(level,type){let i=0,score=0;const total=8;function draw(){if(i===total){finish(score,total,()=>startM(level,type),mathIntro);return}const q=makeM(level,type,i),cols=q.n+1;let attempts=0;const cells=(id,label,small=false)=>Array.from({length:cols},(_,j)=>'<input class="cell '+(small?'smallcell':'')+'" id="'+id+j+'" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="'+label+' '+(['unidades de millar','centenas','decenas','unidades'].slice(-cols)[j])+'">').join('');const digits=n=>String(n).padStart(cols,' ').split('').map(x=>'<div class="digit">'+x+'</div>').join('');let text=q.prob?(q.sub?'En la biblioteca hay '+q.a+' libros. Se prestan '+q.b+'. ¿Cuántos quedan?':'En una caja hay '+q.a+' lápices. Añadimos '+q.b+' más. ¿Cuántos hay ahora?'):(q.sub?'Resuelve la resta.':'Resuelve la suma.');view('<span class="pill">Matemáticas · Nivel '+level+'</span><h2>Reto '+(i+1)+' de '+total+' · ⭐ '+score+'</h2><div class="progress"><span style="width:'+i/total*100+'%"></span></div><section class="panel"><div class="question">'+text+'</div>'+(q.prob?'<p>Elige la operación y coloca los números en las casillas.</p>':'<p>Empieza por las unidades, a la derecha.</p>')+'<p class="muted">Casillas amarillas: anotaciones para las llevadas (opcionales). Casillas blancas: escribe el resultado'+(q.prob?' y los números del problema':'')+'.</p><div class="board" style="grid-template-columns:44px repeat('+cols+',auto)"><span></span>'+['UM','C','D','U'].slice(-cols).map(s=>'<span class="boardlabel">'+s+'</span>').join('')+'<span class="boardlabel">Ayuda</span>'+cells('carry','Anotación',true)+'<span></span>'+(q.prob?cells('a','Primer número'):digits(q.a))+(q.prob?'<select id="op" aria-label="Operación"><option value="">?</option><option>+</option><option>−</option></select>':'<b>'+(q.sub?'−':'+')+'</b>')+(q.prob?cells('b','Segundo número'):digits(q.b))+'<div class="line" style="grid-column:1/-1"></div><span>=</span>'+cells('r','Resultado')+'</div><div class="options"><button id="check" class="primary">Comprobar</button><button id="hintBtn">💡 Pista</button></div><div id="hint" class="rule" hidden></div><div id="feedback" class="feedback" role="status"></div><button id="next" class="primary wide" hidden>Siguiente reto</button></section>');document.querySelectorAll('input.cell').forEach(x=>x.addEventListener('input',()=>{x.value=x.value.replace(/[^0-9]/g,'').slice(-1)}));function read(id){const a=Array.from({length:cols},(_,j)=>el(id+j).value);let s=a.join('');if(!s||a.slice(a.findIndex(x=>x!=='' )).some(x=>x===''))return NaN;return Number(s)}el('hintBtn').onclick=()=>{el('hint').hidden=false;el('hint').textContent=q.sub?'Resta desde la derecha. Si una cifra de arriba es menor, toma una decena de la columna de su izquierda.':'Suma desde la derecha. Si una columna da 10 o más, escribe las unidades y anota la llevada en la columna izquierda.'};el('check').onclick=()=>{const r=read('r'),okOp=!q.prob||(el('op').value===(q.sub?'−':'+')&&((read('a')===q.a&&read('b')===q.b)||(!q.sub&&read('a')===q.b&&read('b')===q.a)));if(!Number.isFinite(r)){el('feedback').textContent='Escribe el resultado completo, empezando por la derecha.';return}const correct=okOp&&r===q.res;if(correct){if(attempts===0)score++;el('feedback').className='feedback good';el('feedback').textContent='¡Muy bien! El resultado es '+q.res+'.';el('next').hidden=false;el('check').disabled=true;document.querySelectorAll('.board input,.board select').forEach(x=>x.disabled=true);el('next').focus()}else{attempts++;el('feedback').className='feedback bad';el('feedback').textContent=!okOp?'Revisa la operación elegida y los números que has colocado.':'Revisa las columnas y las llevadas. ¡Puedes intentarlo otra vez!';if(attempts>=3){el('hint').hidden=false;el('hint').textContent=q.a+(q.sub?' − ':' + ')+q.b+' = '+q.res+'. Coloca el resultado en las casillas para continuar.'}}};el('next').onclick=()=>{i++;draw()}}draw()}
home();
</script></body></html>
