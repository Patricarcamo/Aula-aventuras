<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Palabra a palabra · El tren de las palabras</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#19364a;font:1.08rem/1.5 "Atkinson Hyperlegible Next",system-ui,sans-serif}main,header{max-width:1060px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ccdae0;gap:12px}strong{font-size:1.16em}button,select,input{font:inherit;color:inherit}button,select{border:1.5px solid #9fb3bf;border-radius:12px;background:white;padding:10px 15px;min-height:46px;cursor:pointer}button:hover{border-color:#086364;background:#eefaf7}button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #b8520d;outline-offset:3px}button[aria-pressed=true],.chosen{background:#d4efeb;border:2px solid #156662}.hero{background:#0d484c;color:white;border-radius:24px;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero p,h1,h2,p{margin:0}h1{font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.04em}.hero p{color:#dcf2ed}.train{font-size:3.8rem}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:18px}nav,article{border:1px solid #c9d8df;background:white;border-radius:20px;padding:20px}nav{align-self:start}nav h2{font-size:1rem;margin-bottom:12px}nav button{width:100%;text-align:left;margin-bottom:7px}article{min-width:0}.top,.bar,.chips,.choices{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between;color:#33625d}.small{font-size:.9rem}.track{display:flex;gap:4px;margin:12px 0 20px}.track i{height:5px;flex:1;background:#e3eaeb;border-radius:4px}.track i.on{background:#21837e}h2{font-size:1.65rem}.task{margin:18px 0;background:#f2f7f7;border:1px solid #d9e6e5;border-radius:16px;padding:20px;min-height:124px}.chips,.choices{margin:10px 0}.chip,.choices button{font-size:1.2em;font-weight:600}.chip{display:inline-block;padding:7px 13px;border:2px solid #497d79;background:#dbf0ed;border-radius:9px}.chip:nth-child(even){background:#fbe7c2;border-color:#906b38}.chip[aria-pressed=true]{box-shadow:inset 0 -5px #205e58}.primary{background:#12615e;color:white;border-color:#12615e;font-weight:650}.primary:hover{background:#0c4b49}.bar{margin:14px 0}.feedback{margin:12px 0;font-weight:600}.target{overflow-wrap:anywhere;letter-spacing:.035em;font-size:1.35em;margin-bottom:12px}.letter{padding:4px;min-width:44px;font-size:1.3em;border-radius:6px}.cut{border-right:6px solid #116b63;background:#d9ede8}.slots{padding:12px;min-height:55px;border:2px dashed #a1b7b7;border-radius:10px;margin:12px 0}.note{color:#415c65}.tip{margin-top:10px;padding:12px;border-left:4px solid #24756f}.wide{width:100%;padding:12px;border:2px solid #78939b;border-radius:8px}.big{font-size:1.35rem}.status{font-size:.87em;color:#40615f}button:disabled{cursor:default;opacity:.65}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}nav{padding:12px}nav div{display:flex;gap:6px;flex-wrap:wrap}nav button{width:auto;margin:0;font-size:.94em}.train{font-size:2.4rem}.hero,article{padding:16px}main,header{padding:12px}.hero p{font-size:.94em}}
</style>
<header><div><a href="./index.html" style="color:#165e5c;display:inline-block;padding:8px 0">Volver a Aula de Aventuras</a><br><strong>🚂 &nbsp;Palabra a palabra</strong></div><button id="size" aria-pressed="false">Aa · Letra grande</button></header><main><div class="hero"><div><h1>El tren de las palabras</h1><p>Cada palabra viaja en su propio vagón.</p></div><span class="train" aria-hidden="true">🚃</span></div><div class="layout"><nav aria-label="Actividades"><h2>Elige una actividad</h2><div id="menu"></div></nav><article id="game"></article></div></main>
<script>
const modes=['Contar','Separar','Elegir','Ordenar','Escribir'];
const titles=['Cuenta los vagones','Pon las separaciones','Encuentra la frase','Ordena los vagones','Escribe con espacios'];
const instructions=['Toca cada palabra una vez. Después, elige cuántas hay.','Toca la última letra de cada palabra que necesita un espacio detrás. Tócala otra vez para borrar la marca.','Elige la frase que tiene los espacios en su sitio.','Lee la frase seguida. Toca las tarjetas en orden para reconstruirla.','Copia la frase y deja un espacio entre cada dos palabras.'];
const sets=[['Mi gato duerme','Ana lee despacio','El patio está vacío','La niña toca música','El pez nada en círculos'],['Eva salta','La rana canta','Mi primo corre','La caja es roja','Voy al parque hoy'],['Ana pinta','El sol brilla','Mi mochila pesa','La clase lee cuentos','Voy a la biblioteca'],['Luis canta','La luna sale','Mi amiga lee','El tren llega hoy','Hay pan en la mesa'],['El gato corre','Ana toca palmas','Mi lápiz es azul','La bici tiene luces','Hoy juego con mis amigas']];
const wrong=['An a pinta','El solbrilla','Mi mo chila pesa','Laclase lee cuentos','Voy ala biblioteca'];
const examples=['Ana · lee → 2 palabras.','Sol | y | mar → hay un espacio después de «Sol» y de «y».','«La flor» tiene dos palabras.','Si ves «Evapinta», coloca primero «Eva» y después «pinta».','«Elsolbrilla» se escribe «El sol brilla».'];
const progress=Array(5).fill(0);let mode=0,marks=new Set(),order=[],solved=false,hint=false,answer=null,bank=[],seq=0;
const el=id=>document.getElementById(id);const game=el('game');
function button(label,action,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=action;return b}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function words(){return sets[mode][progress[mode]].split(' ')}
function tokens(where,list){list.forEach(w=>{let s=document.createElement('span');s.className='chip';s.textContent=w;where.append(s)})}
function menu(){el('menu').replaceChildren(...modes.map((s,i)=>{let b=button(s+(progress[i]===5?' ✓':''),()=>{mode=i;start()});b.setAttribute('aria-pressed',mode===i);return b}))}
function start(){seq++;if('speechSynthesis'in window)speechSynthesis.cancel();marks.clear();order=[];solved=false;hint=false;answer=null;menu();if(progress[mode]===5){game.innerHTML='<h2 tabindex="-1">¡Actividad completada!</h2><p>Has resuelto las cinco frases. Puedes repetirlas o elegir otra actividad.</p><div class="bar" id="finish"></div>';el('finish').append(button('Volver a practicar',()=>{progress[mode]=0;start()}),button('Cambiar de actividad',()=>{mode=(mode+1)%5;start()},'primary'));game.querySelector('h2').focus();return}
const w=words(),index=progress[mode];bank=shuffle(w.map((_,i)=>i));if(bank.every((x,i)=>x===i))bank.reverse();
game.innerHTML='<div class="top"><strong>Frase '+(index+1)+' de 5</strong><span class="small">'+modes[mode]+'</span></div><div class="track" aria-hidden="true">'+waste(index)+'</div><h2 tabindex="-1">'+titles[mode]+'</h2><p>'+instructions[mode]+'</p><div class="bar"><button id="audio">♪ Escuchar frase</button><button id="help" aria-expanded="false">Ver pista</button></div><div id="tip" class="tip" hidden></div><div id="task" class="task"></div><div role="status" id="msg" class="feedback"></div><div class="bar" id="actions"></div>';
el('audio').onclick=()=>{if(!('speechSynthesis'in window)){el('msg').textContent='La voz no está disponible. Puedes pedir que te lean la frase.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.join(' '));u.lang='es-ES';u.rate=.82;const id=seq;u.onerror=e=>{if(id===seq&&!['interrupted','canceled'].includes(e.error))el('msg').textContent='La voz no está disponible en este dispositivo. Puedes pedir que te lean la frase.'};speechSynthesis.speak(u)};
el('help').onclick=()=>{hint=!hint;el('tip').hidden=!hint;el('help').textContent=hint?'Ocultar pista':'Ver pista';el('help').setAttribute('aria-expanded',hint);el('tip').innerHTML='<strong>Un vagón por palabra</strong><div class="chips"></div>';tokens(el('tip').lastChild,w)};
const t=el('task');if(mode===0){t.innerHTML='<div class="chips" id="cards"></div><strong>¿Cuántas palabras hay?</strong><div class="choices" id="opts"></div>';w.forEach((s,i)=>{let b=button(s,()=>{toggle(i);b.setAttribute('aria-pressed',marks.has(i))},'chip');b.setAttribute('aria-pressed',false);el('cards').append(b)});options([w.length-1,w.length,w.length+1].sort((a,b)=>a-b).map(String),String(w.length))}
if(mode===1){t.innerHTML='<div class="target"></div><div id="letters"></div>';t.firstChild.textContent=w.join('');let all=w.join('');Array.from(all).forEach((s,i)=>{let b=button(s,()=>{toggle(i);b.classList.toggle('cut',marks.has(i));b.setAttribute('aria-pressed',marks.has(i));b.textContent=s+(marks.has(i)?'│':'')},'letter');b.setAttribute('aria-label','Espacio después de '+s+', letra '+(i+1));b.setAttribute('aria-pressed',false);if(i===all.length-1)b.disabled=true;el('letters').append(b)})}
if(mode===2){t.innerHTML='<div class="choices" id="opts"></div>';options(shuffle([w.join(' '),wrong[index]]),w.join(' '))}
if(mode===3){t.innerHTML='<div class="target"></div><strong>Tu tren</strong><div class="slots" aria-live="polite" id="slots"></div><div class="chips" id="bank"></div><button id="undo">Quitar la última</button>';t.firstChild.textContent=w.join('');bank.forEach(i=>{let b=button(w[i],()=>{order.push(i);syncOrder()},'chip');el('bank').append(b)});el('undo').onclick=()=>{order.pop();syncOrder()};syncOrder()}
if(mode===4){t.innerHTML='<div class="target"></div><label for="field">Tu frase</label><input class="wide" id="field" autocomplete="off" spellcheck="false">';t.firstChild.textContent=w.join('');el('field').onkeydown=e=>{if(e.key==='Enter')check()}}
if(![0,2].includes(mode))el('actions').append(button('Comprobar',check,'primary'));game.querySelector('h2').focus()}
function waste(n){return Array.from({length:5},(_,i)=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')}
function toggle(i){marks.has(i)?marks.delete(i):marks.add(i);el('msg').textContent=''}
function syncOrder(){el('slots').textContent=order.map(i=>words()[i]).join(' ')||'Coloca aquí las palabras.';[...el('bank').children].forEach((b,j)=>b.disabled=order.includes(bank[j]));el('undo').disabled=!order.length;el('msg').textContent=''}
function options(list,right){list.forEach(v=>el('opts').append(button(v,()=>result(v===right))))}
function check(){if(solved)return;let w=words(),stops=[],n=0;for(let s of w.slice(0,-1)){n+=s.length;stops.push(n-1)}let ok=mode===1?marks.size===stops.length&&stops.every(i=>marks.has(i)):mode===3?order.map(i=>w[i]).join(' ')===w.join(' '):el('field').value.trim().replace(/[.!?]$/,'').trim().replace(/\s+/g,' ').toLocaleLowerCase('es')===w.join(' ').toLocaleLowerCase('es');result(ok)}
function result(ok){if(solved)return;let w=words();if(!ok){el('msg').textContent=['Vuelve a tocar una tarjeta por cada palabra. Puedes mirar la pista.','Revisa las marcas. '+examples[1],'Fíjate en las palabras pequeñas y comprueba que las largas estén enteras.','Lee tu tren de izquierda a derecha y compáralo con la frase.','Compara lo que has escrito con los vagones de la pista.'][mode];return}solved=true;el('msg').textContent='¡Lo has conseguido! '+w.join(' ')+'. Son '+w.length+' palabras.';el('task').querySelectorAll('button,input').forEach(b=>b.disabled=true);el('actions').replaceChildren(button(progress[mode]===4?'Terminar actividad':'Siguiente frase',()=>{progress[mode]++;start()},'primary'));el('actions').firstChild.focus()}
el('size').onclick=()=>{let b=document.body.classList.toggle('big');el('size').setAttribute('aria-pressed',b)};start()
</script></html>
