<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103e48"><title>El puerto de las letras · b y d</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#183a41;background:#f8f8ef;font-family:"Trebuchet MS",Arial,sans-serif;font-size:18px}header{background:#103e48;color:white;padding:18px max(5vw,20px);display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:bold;letter-spacing:-.04em;font-size:clamp(18px,3vw,26px)}header button{background:#24515b;color:white;border-color:#91b5b8}main{max-width:1000px;margin:28px auto;padding:0 20px 36px}.banner{background:#dbeee7;border:1px solid #a5c9bd;border-radius:23px;padding:25px 32px;position:relative;overflow:hidden}.banner:after{content:"⚓";position:absolute;right:5%;top:10%;font:90px Georgia;color:#92bcb2;transform:rotate(10deg)}h1,h2,p{margin:0}h1{font: bold clamp(31px,5vw,49px)/1.12 Georgia,serif;letter-spacing:-.045em;position:relative;z-index:1}.banner p{margin:10px 0 0;max-width:80%;position:relative;z-index:1}button{font:inherit;font-weight:bold;cursor:pointer;border:1px solid #a2b6b1;color:inherit;background:white;border-radius:12px;min-height:46px;padding:9px 16px}button:hover{box-shadow:0 2px 0 #5c8984}button:focus-visible,summary:focus-visible{outline:4px solid #7447aa;outline-offset:3px}.models,.grid,.actions,.options{display:flex;gap:12px;flex-wrap:wrap}.models{margin:16px 0 24px}.model{flex:1;display:flex;align-items:center;gap:16px;background:#e4f0fc;border:1px solid #a4bfda;padding:11px 18px;border-radius:16px}.model:last-child{background:#fff0dd;border-color:#d9b28e}.big{font: bold 58px/1 Arial}.b{color:#12569a}.d{color:#963e08}.model small{display:block;color:#314751;font-size:15px;margin-top:3px}.art{font-size:32px;margin-left:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:20px 0 14px}h2{font: bold 29px Georgia,serif}.count{font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.game{text-align:left;padding:19px;background:#fff;border-radius:17px;display:grid;gap:9px;align-content:start}.game .tile{border-radius:10px;width:52px;height:43px;background:#e7f2ec;color:#265950;display:grid;place-items:center;font-size:23px}.game:nth-child(3n+2) .tile{background:#fce8cc;color:#80501f}.game:nth-child(3n) .tile{background:#e8e9fa;color:#524a73}.game small{font-size:15px;font-weight:normal}.panel{background:white;border:1px solid #aec1ba;border-radius:20px;padding:clamp(16px,4vw,32px)}.progress{height:7px;background:#e3eae5;border-radius:7px;margin:12px 0 22px}.progress i{display:block;height:100%;background:#287769;border-radius:7px}.prompt{font-size:21px;margin:16px 0}.sample{font: bold clamp(26px,5vw,44px)/1.35 Arial;margin:20px 0}.options button{min-width:90px;font-size:26px;min-height:60px}.actions{margin-top:20px}.primary{background:#17594e;color:white}.feedback{margin-top:16px;font-weight:bold}.feedback:empty{display:none}[hidden]{display:none!important}summary{cursor:pointer;padding:10px;font-weight:bold}label{display:inline-flex;gap:8px;align-items:center;padding:10px;cursor:pointer}input{width:22px;height:22px}details{margin-top:20px}body.large{font-size:22px}.large .prompt,.large .model small,.large .game small{font-size:1.1em}.large .options button{font-size:32px}@media(max-width:650px){main{padding:0 12px 25px;margin-top:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.banner{padding:20px}.banner:after{display:none}.banner p{max-width:none}.models{gap:7px}.model{gap:8px;padding:9px}.model small{font-size:14px}.big{font-size:44px}.art{display:none}.game{padding:13px}.options button{min-width:67px}.brand{letter-spacing:0}}
</style><header><span class="brand">⚓ &nbsp; El puerto de las letras</span><a href="./" style="color:white;font-size:16px">Aula de Aventuras</a><button id="home">Mis juegos</button></header><main>
<div class="banner"><h1>El puerto de las letras</h1><p>Explora la <strong>b</strong> y la <strong>d</strong> a tu ritmo.</p></div>
<div class="models" aria-label="Modelos para comparar"><div class="model"><span class="big b">b</span><div><b class="b">barco</b><small>Palo a la izquierda</small></div><span class="art" aria-hidden="true">⛵</span></div><div class="model"><span class="big d">d</span><div><b class="d">dado</b><small>Palo a la derecha</small></div><span class="art" aria-hidden="true">🎲</span></div></div>
<section id="menu"><div class="bar"><h2 tabindex="-1" id="menutitle">Elige un juego</h2><span id="total" class="count"></span></div><div class="grid" id="cards"></div></section>
<section class="panel" id="play" hidden><div class="bar"><h2 id="title" tabindex="-1"></h2><span id="step"></span></div><div class="progress"><i id="fill"></i></div><div id="puzzle"><p class="prompt" id="prompt"></p><div class="sample" id="sample"></div><div class="options" id="opts"></div><div class="actions"><button id="hint">Ver pista</button><button id="audio">Escuchar</button></div></div><p id="msg" class="feedback" role="status"></p><div class="actions"><button id="next" class="primary" hidden>Siguiente</button><button id="repeat" hidden>Volver a practicar</button></div></section>
<details><summary>Apoyos de lectura</summary><label><input type="checkbox" id="colors" checked>Colorear la b y la d en los retos</label><label><input type="checkbox" id="size">Ampliar el texto</label></details></main>
<script>
const el=id=>document.getElementById(id);
const games=[
['Encuentra la letra','Distingue las dos formas.','b d','Elige la letra indicada.',[
['Busca la b.',['d','b'],'b'],['Busca la d.',['d','b'],'d'],['¿Cuál tiene el palo a la izquierda?',['b','d'],'b'],['¿Cuál tiene el palo a la derecha?',['b','d'],'d']]],
['Parejas de sílabas','Compara con el modelo.','ba','Elige el grupo idéntico al modelo.',[
['da',['ba','ad','da'],'da'],['bi',['bi','di','ib'],'bi'],['du',['bu','du','ud'],'du'],['bed',['deb','ded','bed'],'bed']]],
['Cada palabra a su puerto','Clasifica lo que lees.','⚓','¿Qué letras encuentras en esta palabra?',[
['nube',['Solo b','Solo d','Las dos'],'Solo b'],['rueda',['Las dos','Solo b','Solo d'],'Solo d'],['bufanda',['Solo d','Las dos','Solo b'],'Las dos'],['debajo',['Solo b','Solo d','Las dos'],'Las dos']]],
['La letra perdida','Completa una palabra.','✎','Elige la letra que falta.',[
['⛵  _arco',['d','b'],'b','Es un barco.'],['🎲  _ado',['d','b'],'d','Es un dado.'],['☁️  nu_e',['b','d'],'b','Es una nube.'],['🛞  rue_a',['b','d'],'d','Es una rueda.'] ]],
['Frases de a bordo','Elige por el significado.','“ ”','¿Qué palabra completa la frase?',[
['Para remar, subo a un ___.',['dote','bote'],'bote'],['Me duele un ___ de la mano.',['dedo','debo'],'dedo'],['Me pongo una ___ en el pie.',['dota','bota'],'bota'],['Te ___ un favor.',['dedo','debo'],'debo']]],
['El mensaje secreto','Busca pistas en una nota.','✉','Lee la nota y elige una palabra.',[
['Mi barco sale al mar.',['mar','barco','sale'],'barco','¿Qué palabra tiene una b?'],['Veo una isla redonda.',['isla','una','redonda'],'redonda','¿Qué palabra tiene dos letras d?'],['Hay un mapa debajo del banco.',['debajo','mapa','banco'],'debajo','¿Qué palabra tiene b y d?'],['El tesoro es una bufanda.',['tesoro','una','bufanda'],'bufanda','¿Qué palabra tiene primero una b y después una d?']]]];
let g=0,pos=0,solved=false,finished=false,visited=new Set();
try{visited=new Set(JSON.parse(localStorage.getItem('puerto-bd-completados')||'[]'))}catch{}
function mark(text){return el('colors').checked?text.replace(/[bd]/g,ch=>'<span class="'+ch+'">'+ch+'</span>'):text}
function stop(){if(window.speechSynthesis)speechSynthesis.cancel()}
function menu(focus=false){stop();el('menu').hidden=false;el('play').hidden=true;el('cards').replaceChildren();el('total').textContent=visited.size+' de 6 juegos completados';
 games.forEach(([name,desc,icon],i)=>{let b=document.createElement('button');b.className='game';b.innerHTML='<span class="tile" aria-hidden="true">'+icon+'</span><strong>'+name+'</strong><small>'+desc+'</small>'+(visited.has(i)?'<small>✓ Completado</small>':'');b.onclick=()=>start(i);el('cards').append(b)});if(focus)el('menutitle').focus()}
function start(i){g=i;pos=0;finished=false;el('menu').hidden=true;el('play').hidden=false;render();el('title').focus()}
function row(){return games[g][4][pos]}
function buttons(){const [s,choices]=row();el('sample').innerHTML=g===0?s:mark(s);el('opts').replaceChildren();choices.forEach(choice=>{let b=document.createElement('button');b.innerHTML=mark(choice);b.disabled=solved;b.onclick=()=>answer(choice);el('opts').append(b)})}
function render(){stop();solved=false;el('title').textContent=games[g][0];el('step').textContent='Reto '+(pos+1)+' de 4';el('fill').style.width=(pos*25)+'%';el('puzzle').hidden=false;el('prompt').textContent=games[g][3]+(g===5?' '+row()[3]:'');el('msg').textContent='';el('repeat').hidden=true;el('next').hidden=true;buttons()}
function clue(){let a=row()[2];if(g===0||g===3)return (g===3?row()[3]+' ':'')+(a==='b'?'Compara con barco: busca el palo a la izquierda.':'Compara con dado: busca el palo a la derecha.');return ['','Compara una letra cada vez, de izquierda a derecha.','Sigue la palabra con el dedo. Busca primero una b y después una d.','','Lee la frase con cada opción. ¿Cuál tiene sentido?', 'Recorre las letras de cada opción y compáralas con los modelos.'][g]}
function answer(choice){if(solved)return;if(choice!==row()[2]){el('msg').textContent='Prueba otra vez. '+clue();return}solved=true;el('msg').textContent='¡Sí! '+(g===3?row()[3]:g===4?row()[0].replace('___',choice):g===2?row()[0]+' · '+choice:choice+'.');el('opts').querySelectorAll('button').forEach(b=>b.disabled=true);el('next').hidden=false;el('next').textContent=pos===3?'Terminar juego':'Siguiente reto';el('next').focus()}
el('next').onclick=()=>{if(finished){menu(true);return}if(pos<3){pos++;render();el('title').focus();return}finished=true;visited.add(g);try{localStorage.setItem('puerto-bd-completados',JSON.stringify([...visited]))}catch{}stop();el('puzzle').hidden=true;el('step').textContent='4 de 4';el('fill').style.width='100%';el('msg').textContent='¡Juego completado! Puedes repetirlo o elegir otra actividad.';el('next').textContent='Elegir otro juego';el('repeat').hidden=false};
el('audio').onclick=()=>{if(!window.speechSynthesis){el('msg').textContent='La voz no está disponible en este navegador. Puedes pedir que te lean el reto.';return}stop();let speak=s=>s.replace(/\bb\b/g,'be').replace(/\bd\b/g,'de').replace(/_+/g,' hueco ');let u=new SpeechSynthesisUtterance(speak(el('prompt').textContent+'. '+(g===3?row()[3]:row()[0])+'. Opciones: '+row()[1].join(', ')));u.lang='es-ES';u.rate=.86;speechSynthesis.speak(u)};
el('hint').onclick=()=>{if(!solved)el('msg').textContent=clue()};el('repeat').onclick=()=>start(g);el('home').onclick=()=>menu(true);el('colors').onchange=()=>{if(!el('play').hidden&&!finished)buttons()};el('size').onchange=()=>document.body.classList.toggle('large',el('size').checked);menu()
</script></html>
