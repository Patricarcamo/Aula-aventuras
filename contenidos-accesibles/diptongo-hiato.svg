<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 900 1260" role="img" aria-label="DIPTONGO Y HIATO"><rect width="900" height="1260" fill="#fffdfd"/><rect x="25" y="25" width="850" height="147" rx="45" fill="#fff2be" stroke="#f2b941" stroke-width="5"/><text x="55" y="91" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#5e298c">DIPTONGO Y HIATO</text><text x="55" y="144" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#3d3254">¿Las vocales van juntas o se separan?</text><rect x="35" y="194" width="830" height="172" rx="26" fill="#fff0d7" stroke="#eab55a" stroke-width="3"/><text x="63" y="253" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#b34c32">VOCALES FUERTES:  A  E  O</text><text x="63" y="312" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#2872ad">VOCALES DÉBILES:   I  U</text><rect x="35" y="388" width="830" height="142" rx="26" fill="#f3e8ff" stroke="#b99adc" stroke-width="3"/><text x="57" y="441" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#733e9c">¡LAS FUERTES SE PELEAN Y SE SEPARAN!</text><text x="80" y="493" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#242342">A + E → A - E         E + O → E - O</text><rect x="35" y="552" width="830" height="300" rx="26" fill="#e9f4ff" stroke="#85afe3" stroke-width="3"/><text x="65" y="612" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#24629a">DIPTONGO = JUNTAS</text><text x="65" y="665" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#242342">Dos vocales en la MISMA sílaba.</text><text x="65" y="716" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242342">Una fuerte + una débil (o al revés).</text><text x="65" y="766" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#242342">También pueden unirse dos débiles (i, u).</text><text x="65" y="824" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#245a8d">AI-re      PEI-ne      CAU-sa      CIU-dad</text><rect x="35" y="873" width="830" height="302" rx="26" fill="#ffeaf2" stroke="#e98bb1" stroke-width="3"/><text x="65" y="933" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#aa2b67">HIATO = SEPARADAS</text><text x="65" y="987" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242342">Dos vocales en sílabas DIFERENTES.</text><text x="65" y="1035" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#242342">Dos fuertes se separan: PO-E-TA, TE-A-TRO.</text><text x="65" y="1085" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#242342">También hay hiato si la débil lleva tilde:</text><text x="65" y="1133" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#aa2b67">MA-ÍZ, PA-ÍS.</text><text x="68" y="1227" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#5e298c">TRUCO: Diptongo = juntas  ·  Hiato = separadas</text></svg>