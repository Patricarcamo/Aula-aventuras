<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1440" viewBox="0 0 1000 1440" role="img" aria-labelledby="tit desc" font-family="Arial, sans-serif"><title id="tit">El aparato circulatorio: infografía de lectura fácil</title><desc id="desc">El corazón bombea sangre. Las arterias salen del corazón, las venas llegan y los capilares las unen. La sangre contiene plasma, glóbulos rojos, glóbulos blancos y plaquetas.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="white"/></marker></defs><rect width="1000" height="1440" fill="#fffdf8"/><rect x="15" y="15" width="970" height="118" rx="20" fill="#064b9a" stroke="none" stroke-width="2"/><text x="43" y="65" font-size="45" font-weight="800" fill="white">EL APARATO CIRCULATORIO</text><rect x="260" y="81" width="480" height="38" rx="20" fill="#b7e5fb" stroke="none" stroke-width="2"/><text x="283" y="108" font-size="24" font-weight="700" fill="#13396c">Infografía de lectura fácil · 6.º Primaria</text><rect x="15" y="150" width="970" height="231" rx="20" fill="#fff9e5" stroke="#eab308" stroke-width="2"/><rect x="25" y="146" width="248" height="52" rx="18" fill="#a16b00" stroke="none" stroke-width="2"/><text x="43" y="181" font-size="30" font-weight="800" fill="white">¿QUÉ ES?</text><text x="38" y="228" font-size="24" font-weight="400" fill="#17263c">Está formado por el corazón, los vasos</text><text x="38" y="262" font-size="24" font-weight="400" fill="#17263c">sanguíneos y la sangre.</text><text x="38" y="296" font-size="24" font-weight="400" fill="#17263c">Lleva oxígeno y nutrientes a las células.</text><text x="38" y="330" font-size="24" font-weight="400" fill="#17263c">Recoge las sustancias de desecho.</text><g transform="translate(590 280) scale(0.55)"><path d="M-22 -40 L-30 -93 -5 -98 7 -48 M11 -45 L16 -93 41 -91 37 -44" stroke="#2571b8" stroke-width="19" fill="none" stroke-linejoin="round"/><path d="M0 -45 Q-25 -100 26 -112 Q73 -114 64 -57 L50 -31" fill="none" stroke="#b9283f" stroke-width="21"/><path d="M15 -92 L15 -124 M36 -103 L47 -133 M54 -94 L75 -115" stroke="#b9283f" stroke-width="13" stroke-linecap="round"/><path d="M0 -32 C-51 -82 -96 -33 -77 20 C-60 70 -4 95 23 108 C77 74 98 24 77 -15 C60 -49 29 -55 0 -32Z" fill="#ee6975" stroke="#a92b40" stroke-width="5"/><path d="M-5 -23 Q-47 -48 -58 -6 L-46 26 -5 28Z M-46 33 Q-31 78 10 91 L-5 33Z" fill="#327ac9" stroke="#174c9d" stroke-width="3"/><path d="M13 -27 Q49 -50 63 -8 L48 24 15 26Z M15 32 L49 29 Q63 61 23 91Z" fill="#c62b44" stroke="#9e233a" stroke-width="3"/><path d="M-3 -25 L12 91" stroke="#f8b0b0" stroke-width="8"/><path d="M-30 0 L-25 22 M-25 44 L-12 65 M38 0 L35 22 M35 45 L30 65" stroke="white" stroke-width="4" marker-end="url(#arrow)" fill="none"/></g><text x="545" y="365" font-size="20" font-weight="700" fill="#a92b40">Corazón</text><g transform="translate(694 271)"><path d="M0 0 H26 M100 0 H126" stroke-width="12" stroke-linecap="round" stroke="#af324d" fill="none"/><path d="M100 0 H126" stroke="#2868b7" stroke-width="12"/><g stroke="#884eae" stroke-width="3" fill="none"><path d="M25 0 Q56 -49 101 0 M25 0 Q56 49 101 0 M25 0 Q56 -24 101 0 M25 0 Q56 24 101 0 M25 0 H101 M43 -23 L81 22 M43 23 L81 -22 M63 -29 V29"/></g></g><text x="682" y="340" font-size="20" font-weight="700" fill="#563183">Vasos</text><text x="670" y="365" font-size="20" font-weight="700" fill="#563183">sanguíneos</text><g transform="translate(894 263) rotate(-18)"><ellipse rx="35" ry="23" fill="#d83c46" stroke="#9e202f" stroke-width="3"/><ellipse rx="17" ry="9" fill="#a62135"/><path d="M-24 -9 Q0 -23 23 -7" fill="none" stroke="#ff9097" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(929 294) rotate(-18)"><ellipse rx="35" ry="23" fill="#d83c46" stroke="#9e202f" stroke-width="3"/><ellipse rx="17" ry="9" fill="#a62135"/><path d="M-24 -9 Q0 -23 23 -7" fill="none" stroke="#ff9097" stroke-width="4" stroke-linecap="round"/></g><text x="880" y="365" font-size="20" font-weight="700" fill="#a92b40">Sangre</text><rect x="15" y="405" width="522" height="445" rx="20" fill="#fff0f4" stroke="#d42d67" stroke-width="2"/><rect x="25" y="398" width="273" height="52" rx="18" fill="#b92561" stroke="none" stroke-width="2"/><text x="43" y="433" font-size="30" font-weight="800" fill="white">EL CORAZÓN</text><text x="35" y="480" font-size="23" font-weight="400" fill="#17263c">Está en el pecho, entre los pulmones.</text><text x="35" y="509" font-size="23" font-weight="400" fill="#17263c">Es un músculo que late: se contrae</text><text x="35" y="538" font-size="23" font-weight="400" fill="#17263c">y se relaja para bombear la sangre.</text><text x="35" y="567" font-size="23" font-weight="400" fill="#17263c">Tiene 4 cavidades: 2 aurículas arriba</text><text x="35" y="596" font-size="23" font-weight="400" fill="#17263c">y 2 ventrículos abajo.</text><g transform="translate(278 699) scale(0.95)"><path d="M-22 -40 L-30 -93 -5 -98 7 -48 M11 -45 L16 -93 41 -91 37 -44" stroke="#2571b8" stroke-width="19" fill="none" stroke-linejoin="round"/><path d="M0 -45 Q-25 -100 26 -112 Q73 -114 64 -57 L50 -31" fill="none" stroke="#b9283f" stroke-width="21"/><path d="M15 -92 L15 -124 M36 -103 L47 -133 M54 -94 L75 -115" stroke="#b9283f" stroke-width="13" stroke-linecap="round"/><path d="M0 -32 C-51 -82 -96 -33 -77 20 C-60 70 -4 95 23 108 C77 74 98 24 77 -15 C60 -49 29 -55 0 -32Z" fill="#ee6975" stroke="#a92b40" stroke-width="5"/><path d="M-5 -23 Q-47 -48 -58 -6 L-46 26 -5 28Z M-46 33 Q-31 78 10 91 L-5 33Z" fill="#327ac9" stroke="#174c9d" stroke-width="3"/><path d="M13 -27 Q49 -50 63 -8 L48 24 15 26Z M15 32 L49 29 Q63 61 23 91Z" fill="#c62b44" stroke="#9e233a" stroke-width="3"/><path d="M-3 -25 L12 91" stroke="#f8b0b0" stroke-width="8"/><path d="M-30 0 L-25 22 M-25 44 L-12 65 M38 0 L35 22 M35 45 L30 65" stroke="white" stroke-width="4" marker-end="url(#arrow)" fill="none"/></g><text x="28" y="661" font-size="18" font-weight="700" fill="#174c9d">Aurícula</text><text x="28" y="683" font-size="18" font-weight="700" fill="#174c9d">derecha</text><path d="M120 675 L242 690" stroke="#174c9d" fill="none" stroke-width="2"/><text x="391" y="661" font-size="18" font-weight="700" fill="#a92b40">Aurícula</text><text x="391" y="683" font-size="18" font-weight="700" fill="#a92b40">izquierda</text><path d="M390 675 L309 692" stroke="#a92b40" fill="none" stroke-width="2"/><text x="27" y="755" font-size="18" font-weight="700" fill="#174c9d">Ventrículo</text><text x="27" y="777" font-size="18" font-weight="700" fill="#174c9d">derecho</text><path d="M130 765 L251 756" stroke="#174c9d" fill="none" stroke-width="2"/><text x="382" y="755" font-size="18" font-weight="700" fill="#a92b40">Ventrículo</text><text x="382" y="777" font-size="18" font-weight="700" fill="#a92b40">izquierdo</text><path d="M382 765 L309 756" stroke="#a92b40" fill="none" stroke-width="2"/><text x="31" y="817" font-size="22" font-weight="400" fill="#17263c">Las válvulas dejan pasar la sangre de</text><text x="31" y="842" font-size="22" font-weight="400" fill="#17263c">la aurícula al ventrículo.</text><rect x="550" y="405" width="435" height="445" rx="20" fill="#eff8ff" stroke="#2482c1" stroke-width="2"/><rect x="558" y="398" width="419" height="52" rx="18" fill="#0766ac" stroke="none" stroke-width="2"/><text x="576" y="433" font-size="30" font-weight="800" fill="white">VASOS SANGUÍNEOS</text><rect x="560" y="464" width="414" height="120" rx="20" fill="#ffe5e8" stroke="none" stroke-width="2"/><g transform="translate(568 523)"><rect x="0" y="-17" width="120" height="34" rx="17" fill="#c62b44"/><ellipse cx="8" cy="0" rx="11" ry="15" fill="white" opacity=".35"/><path d="M28 0 H98" fill="none" stroke="white" stroke-width="5" marker-end="url(#arrow)"/></g><text x="710" y="492" font-size="25" font-weight="800" fill="#a92b40">Arterias</text><text x="710" y="521" font-size="19" font-weight="400" fill="#17263c">Salen del corazón.</text><text x="710" y="544" font-size="19" font-weight="400" fill="#17263c">Llevan la sangre desde</text><text x="710" y="567" font-size="19" font-weight="400" fill="#17263c">el corazón al cuerpo.</text><rect x="560" y="592" width="414" height="120" rx="20" fill="#e0f0ff" stroke="none" stroke-width="2"/><g transform="translate(568 653)"><rect x="0" y="-17" width="120" height="34" rx="17" fill="#2879c8"/><ellipse cx="8" cy="0" rx="11" ry="15" fill="white" opacity=".35"/><path d="M98 0 H28" fill="none" stroke="white" stroke-width="5" marker-end="url(#arrow)"/></g><text x="710" y="620" font-size="25" font-weight="800" fill="#185caa">Venas</text><text x="710" y="649" font-size="19" font-weight="400" fill="#17263c">Llegan al corazón.</text><text x="710" y="672" font-size="19" font-weight="400" fill="#17263c">Llevan la sangre del</text><text x="710" y="695" font-size="19" font-weight="400" fill="#17263c">cuerpo al corazón.</text><rect x="560" y="720" width="414" height="120" rx="20" fill="#f0e5fc" stroke="none" stroke-width="2"/><g transform="translate(565 786)"><path d="M0 0 H26 M100 0 H126" stroke-width="12" stroke-linecap="round" stroke="#af324d" fill="none"/><path d="M100 0 H126" stroke="#2868b7" stroke-width="12"/><g stroke="#884eae" stroke-width="3" fill="none"><path d="M25 0 Q56 -49 101 0 M25 0 Q56 49 101 0 M25 0 Q56 -24 101 0 M25 0 Q56 24 101 0 M25 0 H101 M43 -23 L81 22 M43 23 L81 -22 M63 -29 V29"/></g></g><text x="710" y="748" font-size="25" font-weight="800" fill="#7644a8">Capilares</text><text x="710" y="777" font-size="19" font-weight="400" fill="#17263c">Son vasos muy finos.</text><text x="710" y="800" font-size="19" font-weight="400" fill="#17263c">Unen arterias y venas.</text><rect x="15" y="871" width="970" height="395" rx="20" fill="#f1fbf3" stroke="#238b4b" stroke-width="2"/><rect x="25" y="864" width="225" height="52" rx="18" fill="#16763b" stroke="none" stroke-width="2"/><text x="43" y="899" font-size="30" font-weight="800" fill="white">LA SANGRE</text><text x="267" y="900" font-size="22" font-weight="400" fill="#17263c">Circula por el corazón y los vasos sanguíneos.</text><text x="267" y="928" font-size="22" font-weight="400" fill="#17263c">Contiene plasma, células y fragmentos celulares.</text><rect x="27" y="951" width="185" height="298" rx="13" fill="#fff6d5" stroke="#916600" stroke-width="2"/><text x="36" y="983" font-size="21" font-weight="800" fill="#916600">Plasma</text><path d="M119 1002 Q77 1049 92 1069 Q119 1093 146 1069 Q161 1049 119 1002Z" fill="#ffce38" stroke="#e4a30e" stroke-width="3"/><text x="37" y="1101" font-size="18" font-weight="400" fill="#17263c">Parte líquida.</text><text x="37" y="1128" font-size="18" font-weight="400" fill="#17263c">Contiene agua.</text><text x="37" y="1155" font-size="18" font-weight="400" fill="#17263c">Transporta</text><text x="37" y="1182" font-size="18" font-weight="400" fill="#17263c">nutrientes y</text><text x="37" y="1209" font-size="18" font-weight="400" fill="#17263c">otras sustancias.</text><rect x="223" y="951" width="185" height="298" rx="13" fill="#ffe9e9" stroke="#a92b40" stroke-width="2"/><text x="232" y="983" font-size="21" font-weight="800" fill="#a92b40">Glóbulos rojos</text><g transform="translate(294 1036) rotate(-18)"><ellipse rx="35" ry="23" fill="#d83c46" stroke="#9e202f" stroke-width="3"/><ellipse rx="17" ry="9" fill="#a62135"/><path d="M-24 -9 Q0 -23 23 -7" fill="none" stroke="#ff9097" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(342 1057) rotate(-18)"><ellipse rx="35" ry="23" fill="#d83c46" stroke="#9e202f" stroke-width="3"/><ellipse rx="17" ry="9" fill="#a62135"/><path d="M-24 -9 Q0 -23 23 -7" fill="none" stroke="#ff9097" stroke-width="4" stroke-linecap="round"/></g><text x="233" y="1101" font-size="18" font-weight="400" fill="#17263c">Transportan</text><text x="233" y="1128" font-size="18" font-weight="400" fill="#17263c">el oxígeno.</text><text x="233" y="1155" font-size="18" font-weight="400" fill="#17263c">También se llaman</text><text x="233" y="1182" font-size="18" font-weight="400" fill="#17263c">eritrocitos.</text><rect x="419" y="951" width="185" height="298" rx="13" fill="#f1e6fb" stroke="#6739a3" stroke-width="2"/><text x="428" y="983" font-size="18" font-weight="800" fill="#6739a3">Glóbulos blancos</text><g transform="translate(511 1045)"><circle r="34" fill="#dcc9f8" stroke="#8053bc" stroke-width="3"/><path d="M-18 -8 Q-20 -28 0 -17 Q18 -24 19 -5 Q31 12 10 20 Q-7 28 -12 11 Q-30 10 -18 -8Z" fill="#8251ba"/></g><text x="429" y="1101" font-size="18" font-weight="400" fill="#17263c">Defienden el cuerpo</text><text x="429" y="1128" font-size="18" font-weight="400" fill="#17263c">de las infecciones.</text><text x="429" y="1155" font-size="18" font-weight="400" fill="#17263c">También se llaman</text><text x="429" y="1182" font-size="18" font-weight="400" fill="#17263c">leucocitos.</text><rect x="615" y="951" width="174" height="298" rx="13" fill="#e6f4ff" stroke="#185caa" stroke-width="2"/><text x="624" y="983" font-size="21" font-weight="800" fill="#185caa">Plaquetas</text><g transform="translate(671 1035)"><path d="M0 -21 L6 -8 19 -12 12 2 21 13 5 12 -3 24 -9 10 -23 8 -13 -3 -17 -17 -5 -12Z" fill="#b78be2" stroke="#7852a9" stroke-width="2"/></g><g transform="translate(718 1053)"><path d="M0 -21 L6 -8 19 -12 12 2 21 13 5 12 -3 24 -9 10 -23 8 -13 -3 -17 -17 -5 -12Z" fill="#b78be2" stroke="#7852a9" stroke-width="2"/></g><text x="625" y="1101" font-size="18" font-weight="400" fill="#17263c">Son fragmentos</text><text x="625" y="1128" font-size="18" font-weight="400" fill="#17263c">de células.</text><text x="625" y="1155" font-size="18" font-weight="400" fill="#17263c">Ayudan a taponar</text><text x="625" y="1182" font-size="18" font-weight="400" fill="#17263c">las heridas y</text><text x="625" y="1209" font-size="18" font-weight="400" fill="#17263c">detener el sangrado.</text><g><rect x="805" y="985" width="46" height="219" rx="19" fill="#fff" stroke="#35718f" stroke-width="3"/><rect x="805" y="972" width="46" height="28" rx="5" fill="#2677b8"/><path d="M811 1005 H845 V1106 H811Z" fill="#f7cc2d"/><path d="M811 1106 H845 V1111 H811Z" fill="#d5b8eb"/><path d="M811 1111 H845 V1183 Q845 1198 828 1198 Q811 1198 811 1183Z" fill="#b82d40"/></g><text x="860" y="1020" font-size="18" font-weight="400" fill="#916600">Plasma</text><text x="860" y="1044" font-size="18" font-weight="400" fill="#916600">55 %</text><text x="860" y="1090" font-size="16" font-weight="400" fill="#6739a3">Blancos y</text><text x="860" y="1110" font-size="16" font-weight="400" fill="#6739a3">plaquetas</text><text x="860" y="1130" font-size="16" font-weight="400" fill="#6739a3">1 %</text><text x="860" y="1170" font-size="18" font-weight="400" fill="#a92b40">Rojos</text><text x="860" y="1194" font-size="18" font-weight="400" fill="#a92b40">44 %</text><rect x="15" y="1285" width="970" height="140" rx="20" fill="#f4edff" stroke="#8050b2" stroke-width="2"/><rect x="24" y="1278" width="225" height="52" rx="18" fill="#7443aa" stroke="none" stroke-width="2"/><text x="42" y="1313" font-size="30" font-weight="800" fill="white">RECUERDA</text><text x="34" y="1370" font-size="24" font-weight="400" fill="#17263c">El corazón bombea.</text><text x="34" y="1401" font-size="24" font-weight="400" fill="#17263c">Las arterias salen.</text><text x="500" y="1370" font-size="24" font-weight="400" fill="#17263c">Las venas llegan.</text><text x="500" y="1401" font-size="24" font-weight="400" fill="#17263c">La sangre lleva oxígeno y nutrientes.</text></svg>