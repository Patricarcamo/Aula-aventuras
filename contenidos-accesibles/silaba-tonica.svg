<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 900 1260" role="img" aria-label="LA SÍLABA TÓNICA"><rect width="900" height="1260" fill="#fffdfd"/><rect x="25" y="25" width="850" height="147" rx="45" fill="#fff2be" stroke="#f2b941" stroke-width="5"/><text x="55" y="91" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#5e298c">LA SÍLABA TÓNICA</text><text x="55" y="144" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#3d3254">Es la sílaba que pronunciamos con MÁS FUERZA.</text><rect x="35" y="202" width="830" height="303" rx="26" fill="#ffe9f1" stroke="#e98bb1" stroke-width="3"/><text x="68" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#9e245f">AGUDAS</text><text x="68" y="312" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242342">La sílaba tónica está en la ÚLTIMA sílaba.</text><text x="105" y="385" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#242342">ca-FÉ</text><text x="350" y="385" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#242342">pa-PEL</text><text x="590" y="385" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#242342">can-CIÓN</text><text x="68" y="461" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#633d5c">Ejemplo: ca-FÉ → suena más fuerte FÉ.</text><rect x="35" y="528" width="830" height="303" rx="26" fill="#e6f8ea" stroke="#83c79b" stroke-width="3"/><text x="68" y="586" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#21764f">LLANAS</text><text x="68" y="638" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242342">La sílaba tónica está en la PENÚLTIMA sílaba.</text><text x="102" y="711" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#242342">ME-sa</text><text x="348" y="711" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#242342">LÁ-piz</text><text x="593" y="711" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#242342">ÁR-bol</text><text x="68" y="787" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#295f49">Ejemplo: ME-sa → suena más fuerte ME.</text><rect x="35" y="854" width="830" height="303" rx="26" fill="#e8f2ff" stroke="#7eaee5" stroke-width="3"/><text x="68" y="912" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#235b9a">ESDRÚJULAS</text><text x="68" y="964" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#242342">La sílaba tónica está en la ANTEPENÚLTIMA.</text><text x="100" y="1037" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#242342">MÚ-si-ca</text><text x="357" y="1037" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#242342">PÁ-ja-ro</text><text x="614" y="1037" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#242342">MÉ-di-co</text><text x="68" y="1117" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#225586">Las esdrújulas siempre llevan tilde.</text><text x="65" y="1210" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#63348b">TRUCO: Cuenta las sílabas desde el final.</text></svg>