<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 900 1260" role="img" aria-label="¿CUÁNDO LLEVAN TILDE?"><rect width="900" height="1260" fill="#fffdfd"/><rect x="25" y="25" width="850" height="147" rx="45" fill="#fff2be" stroke="#f2b941" stroke-width="5"/><text x="55" y="91" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#5e298c">¿CUÁNDO LLEVAN TILDE?</text><text x="55" y="144" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#3d3254">Primero busca la sílaba tónica; después mira cómo acaba.</text><rect x="35" y="197" width="830" height="302" rx="26" fill="#ffe9f1" stroke="#e98bb1" stroke-width="3"/><text x="65" y="255" font-family="Arial, sans-serif" font-size="41" font-weight="700" fill="#9e245f">AGUDAS</text><text x="65" y="307" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242342">Llevan tilde si terminan en VOCAL, N o S.</text><text x="72" y="367" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#9e245f">CON tilde</text><text x="499" y="367" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#9e245f">SIN tilde</text><text x="72" y="418" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#242342">ca-FÉ   can-CIÓN</text><text x="499" y="418" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#242342">pa-PEL   re-LOJ</text><text x="65" y="470" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242342">Si terminan en otras consonantes, no llevan tilde.</text><rect x="35" y="521" width="830" height="302" rx="26" fill="#e6f8ea" stroke="#83c79b" stroke-width="3"/><text x="65" y="579" font-family="Arial, sans-serif" font-size="41" font-weight="700" fill="#21764f">LLANAS</text><text x="65" y="631" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#242342">Llevan tilde si NO terminan en vocal, N o S.</text><text x="72" y="691" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#21764f">CON tilde</text><text x="499" y="691" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#21764f">SIN tilde</text><text x="72" y="742" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#242342">LÁ-piz   ÁR-bol</text><text x="499" y="742" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#242342">ME-sa   JO-ven</text><text x="65" y="791" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#242342">Acaban en vocal, N o S → normalmente sin tilde.</text><rect x="35" y="845" width="830" height="296" rx="26" fill="#e8f2ff" stroke="#7eaee5" stroke-width="3"/><text x="65" y="903" font-family="Arial, sans-serif" font-size="41" font-weight="700" fill="#235b9a">ESDRÚJULAS</text><text x="65" y="960" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242342">SIEMPRE llevan tilde.</text><text x="92" y="1042" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#242342">MÚ-si-ca</text><text x="359" y="1042" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#242342">PÁ-ja-ro</text><text x="631" y="1042" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#242342">MÉ-di-co</text><text x="65" y="1113" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#235b9a">No hay esdrújulas sin tilde.</text><text x="46" y="1205" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#63348b">RECUERDA: No todas las sílabas tónicas llevan tilde.</text></svg>