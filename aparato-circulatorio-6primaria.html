{title:'¿Para qué sirve?',visual:overview,alt:'Corazón, salida y regreso de sangre y células del cuerpo',lines:['El <b>aparato circulatorio</b> lleva sangre por todo el cuerpo.','La sangre lleva <b>oxígeno</b> y <b>nutrientes</b> a las células.','También recoge las <b>sustancias de desecho</b>. El cuerpo necesita eliminarlas.'],key:'Lleva lo que las células necesitan y recoge desechos.',check:'¿Qué lleva la sangre a las células?',opts:['Oxígeno y nutrientes','Solo aire','Huesos'],answer:0},

const understand=[mc('¿Cuál es la función del aparato circulatorio?',['Transportar oxígeno y nutrientes y recoger desechos','Triturar alimentos','Introducir aire en los pulmones'],0,'Piensa en lo que viaja en la sangre.','La sangre transporta sustancias útiles y recoge desechos.',overview),mc('Señala el corazón.',['vasos','corazon','sangre'],1,'Es el órgano que late.','El corazón bombea la sangre.'),match('Une cada parte con su función.',[['Corazón','Bombea la sangre'],['Vasos sanguíneos','Conductos por donde circula la sangre'],['Sangre','Transporta sustancias']], 'Piensa en la bomba, los tubos y el líquido.'),mc('¿Dónde se encuentra el corazón?',['Entre los pulmones','En el abdomen','Dentro de la cabeza'],0,'Está en el pecho.','Está dentro de la caja torácica, entre los pulmones.'),mc('¿Cuántas cavidades tiene el corazón?',['2','4','6'],1,'Cuenta dos arriba y dos abajo.','Tiene cuatro cavidades.',heartMap),match('Relaciona cada palabra con su significado.',[['Aurículas','Cavidades superiores'],['Ventrículos','Cavidades inferiores'],['Tabique','Separa los dos lados'],['Válvula','Deja pasar sangre en un sentido']], 'Mira el esquema del corazón.'),match('Une cada vaso con su dirección.',[['Arteria','Sale del corazón'],['Vena','Llega al corazón'],['Capilar','Conecta arterias y venas']], 'Arteria = sale. Vena = vuelve.'),match('Une cada componente de la sangre con su función.',[['Plasma','Transporta nutrientes y otras sustancias'],['Glóbulos rojos','Transportan oxígeno'],['Glóbulos blancos','Defienden frente a infecciones'],['Plaquetas','Ayudan a detener el sangrado']], 'Recuerda las cuatro funciones.'),mc('Observa el tubo. ¿Qué componente ocupa más espacio?',['Plasma','Glóbulos rojos','Glóbulos blancos y plaquetas'],0,'Busca el porcentaje mayor.','El plasma ocupa el 55 % en este dibujo.',tube)];
const practice=[fill('El corazón está formado por tejido ___.',['muscular','óseo','nervioso'],0,'Es un músculo.','El corazón está formado por tejido muscular.'),fill('Cada vez que late, el corazón se ___ y se relaja.',['rompe','contrae','seca'],1,'Primero se aprieta.','El corazón se contrae y se relaja.'),fill('El corazón ___ sangre para todo el cuerpo.',['bombea','respira','digiera'],0,'Funciona como una bomba.','El corazón bombea la sangre.'),fill('Las células reciben ___ y nutrientes.',['oxígeno','huesos','aire directamente'],0,'Los glóbulos rojos lo transportan.','Las células reciben oxígeno y nutrientes.'),order('Ordena el recorrido desde un ventrículo hasta una aurícula.',['Ventrículo','Arteria','Capilares','Vena','Aurícula'],'Primero sale del corazón y al final vuelve.','La sangre sale por una arteria, pasa por capilares y vuelve por una vena.'),order('Ordena el paso de sangre dentro de una mitad del corazón.',['Aurícula','Válvula','Ventrículo'],'Empieza por la cavidad de arriba.','La sangre pasa de la aurícula al ventrículo a través de una válvula.'),match('Relaciona los vasos principales con la cavidad correspondiente.',[['Venas cavas','Llegan a la aurícula derecha'],['Venas pulmonares','Llegan a la aurícula izquierda'],['Arteria pulmonar','Sale del ventrículo derecho'],['Arteria aorta','Sale del ventrículo izquierdo']], 'Puedes consultar la tarjeta 6 de la fase 1.'),mc('Te haces una pequeña herida. ¿Qué componente ayuda a formar un tapón?',['rojos','blancos','plaquetas'],2,'Son pequeños fragmentos celulares.','Las plaquetas ayudan a detener el sangrado.'),mc('Un microorganismo provoca una infección. ¿Qué células ayudan a defenderte?',['plasma','blancos','rojos'],1,'Son las células de defensa.','Los glóbulos blancos combaten microorganismos.'),mc('¿Qué componente transporta el oxígeno que necesitan las células?',['rojos','plaquetas','blancos'],0,'También se llaman eritrocitos.','Los glóbulos rojos transportan oxígeno.'),mc('¿Qué parte líquida transporta nutrientes?',['plasma','rojos','plaquetas'],0,'Contiene sobre todo agua.','El plasma transporta nutrientes.'),mc('¿Qué porcentaje ocupan los glóbulos rojos en el dibujo del libro?',['55 %','44 %','1 %'],1,'Mira la zona roja del tubo.','En el ejemplo ocupan el 44 %.',tube)];
const review=[mc('¿Cuáles son las tres partes del aparato circulatorio?',['Corazón, vasos sanguíneos y sangre','Pulmones, corazón y estómago','Sangre, huesos y músculos'],0,'Una bomba, unos tubos y un líquido.','Corazón, vasos sanguíneos y sangre.'),textq('Escribe el nombre de las cavidades superiores del corazón.',['auriculas','auricula'],'Empieza por A.','Se llaman aurículas.',['Aurículas','Ventrículos','Capilares']),textq('Escribe el nombre de las cavidades inferiores.',['ventriculos','ventriculo'],'Empieza por V.','Se llaman ventrículos.',['Ventrículos','Aurículas','Válvulas']),mc('Las arterias llegan a las aurículas. ¿Es verdadero o falso?',['Verdadero','Falso'],1,'Las arterias salen del corazón.','Es falso: las venas llegan a las aurículas.'),mc('¿Qué vasos son los más finos?',['Venas','Capilares','Arterias'],1,'Están entre arterias y venas.','Los capilares son los más delgados.'),match('Repasa las cuatro funciones de la sangre.',[['Plasma','Transporta nutrientes'],['Glóbulos rojos','Transportan oxígeno'],['Glóbulos blancos','Defienden frente a infecciones'],['Plaquetas','Ayudan a parar el sangrado']], 'Recuerda: líquido, oxígeno, defensa, tapón.'),mc('¿Qué células son las más numerosas en la sangre del dibujo?',['Glóbulos blancos','Glóbulos rojos','Plaquetas'],1,'El 44 % corresponde a las células rojas.','Los glóbulos rojos son las células más numerosas.',tube),mc('¿Por qué los glóbulos rojos participan en la nutrición?',['Porque transportan oxígeno a las células','Porque taponan heridas','Porque destruyen todos los microbios'],0,'Las células necesitan oxígeno.','Transportan el oxígeno que las células necesitan.'),mc('¿Para qué sirve una válvula del corazón?',['Para permitir el paso de la aurícula al ventrículo sin retroceder','Para separar el corazón en dos mitades','Para producir sangre'],0,'Deja pasar en un solo sentido.','La válvula permite que la sangre avance sin volver atrás.',heartMap),mc('¿Qué recoge la sangre de las células?',['Sustancias de desecho','Huesos','Alimentos enteros'],0,'Son sustancias que el cuerpo necesita eliminar.','Recoge sustancias de desecho.',overview)];
const phases=[{name:'1. Aprendo',sub:'Lectura fácil',data:lessons},{name:'2. Comprendo',sub:'Identifico y relaciono',data:understand},{name:'3. Practico',sub:'Completo y aplico',data:practice},{name:'4. Repaso',sub:'Compruebo lo aprendido',data:review}];
const $=id=>document.getElementById(id);let phase=0,index=[0,0,0,0],completed=phases.map(()=>new Set()),tries={},local={};
const key=()=>phase+':'+index[phase],state=()=>local[key()]||(local[key()]={selected:null,matched:[],sequence:[],hint:false,feedback:'',good:false,done:false,value:'',bank:false});
const shuffle=arr=>{let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/[^a-z0-9 ]/g,'').replace(/^(las|los|la|el)\s+/,'').replace(/\s+/g,' ')}
function save(){try{localStorage.setItem('circulatorio-v1',JSON.stringify({phase,index,completed:completed.map(x=>[...x]),tries,local,large:document.body.classList.contains('large'),contrast:document.body.classList.contains('contrast')}))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem('circulatorio-v1')||'null');if(x&&Array.isArray(x.completed)&&x.completed.length===4){phase=x.phase;index=x.index;completed=x.completed.map(a=>new Set(a));tries=x.tries||{};local=x.local||{};document.body.classList.toggle('large',!!x.large);document.body.classList.toggle('contrast',!!x.contrast)}}catch(e){}}
function tabs(){ $('tabs').innerHTML=phases.map((p,i)=>`<button data-phase="${i}" ${phase===i?'aria-current="step"':''}>${p.name}<span>${p.sub} · ${completed[i].size}/${p.data.length}</span></button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{phase=+b.dataset.phase;render(true)});$('size').setAttribute('aria-pressed',document.body.classList.contains('large'));$('contrast').setAttribute('aria-pressed',document.body.classList.contains('contrast'))}
const mark=(message)=>{let s=state();s.done=true;s.good=true;s.feedback='✓ '+message;completed[phase].add(index[phase]);render(false)};
const fail=(message)=>{let s=state();s.good=false;s.feedback='↻ '+message;tries[key()]=(tries[key()]||0)+1;render(false)};
function hintText(q){return phase===0?q.key:q.h}
function render(focus=false){let p=phases[phase],q=p.data[index[phase]],s=state(),pos=index[phase]+1;tabs();$('status').textContent=`${p.name} · ${pos} de ${p.data.length}`;$('done').textContent=`Completadas: ${completed.reduce((a,b)=>a+b.size,0)} de ${phases.reduce((a,b)=>a+b.data.length,0)}`;let pc=Math.round(100*completed[phase].size/p.data.length);$('bar').style.width=pc+'%';$('bar').parentElement.setAttribute('aria-valuenow',pc);let content='';
if(phase===0){content=`<div class="kicker">Lee y observa · Paso ${pos}</div><h2 tabindex="-1" id="heading">${q.title}</h2>`;if(q.tiles){content+=`<div class="grid">${q.tiles.map(([id,t,desc])=>`<div class="tile">${icons[id]}<h3>${t}</h3><p>${desc}</p></div>`).join('')}</div>`}else{content+=`<div class="split"><div>${q.lines.map(l=>`<p class="sentence">${l}</p>`).join('')}</div><div class="visual">${q.visual}</div></div>`}content+=`<p class="key">Idea clave: ${q.key}</p>${q.extra?`<p class="small">${q.extra}</p>`:''}<h3>Comprueba que lo entiendes</h3><p>${q.check}</p>${choiceMarkup(q.opts,s)}`;
}else{content=`<div class="kicker">${q.type==='match'?'Relaciona':q.type==='order'?'Ordena':q.type==='fill'?'Completa':q.type==='text'?'Escribe o elige':'Elige una respuesta'} · Paso ${pos}</div><h2 tabindex="-1" id="heading">${esc(q.q)}</h2>${q.visual?`<div class="visual" style="max-width:560px;margin:auto">${q.visual}</div>`:''}`;
if(q.type==='mc'||q.type==='fill')content+=choiceMarkup(q.opts,s);
if(q.type==='match'){if(!s.right)s.right=shuffle(q.pairs.map((_,i)=>i));content+=`<p class="small">1. Pulsa una palabra de la izquierda. 2. Pulsa su significado de la derecha.</p><div class="match"><div>${q.pairs.map((pair,i)=>`<button data-left="${i}" ${s.matched.includes(i)?'disabled class="correct"':s.selected===i?'class="selected" aria-pressed="true"':'aria-pressed="false"'}>${s.matched.includes(i)?'✓ ':''}${esc(pair[0])}</button>`).join('')}</div><div>${s.right.map(i=>`<button data-right="${i}" ${s.matched.includes(i)?'disabled class="correct"':''}>${s.matched.includes(i)?'✓ ':''}${esc(q.pairs[i][1])}</button>`).join('')}</div></div><p class="small">Parejas correctas: ${s.matched.length}/${q.pairs.length}</p>`}
if(q.type==='order'){if(!s.pool)s.pool=shuffle(q.items.map((_,i)=>i));if(s.pool.every((v,i)=>v===i))s.pool.reverse();content+=`<p class="small">Pulsa las palabras en el orden correcto. Puedes deshacer el último paso.</p><div class="lineup" aria-label="Secuencia seleccionada">${s.sequence.length?s.sequence.map((v,i)=>`<span class="chip">${i+1}. ${esc(q.items[v])}</span>`).join('<span aria-hidden="true">→</span>'):'<span class="small">Tu recorrido aparecerá aquí.</span>'}</div><div class="choices">${s.pool.map(i=>`<button data-order="${i}" ${s.sequence.includes(i)||s.done?'disabled':''}>${esc(q.items[i])}</button>`).join('')}</div><div class="tools"><button id="undo" ${s.done||!s.sequence.length?'disabled':''}>Deshacer último</button><button class="primary" id="checkorder" ${s.done||s.sequence.length!==q.items.length?'disabled':''}>Comprobar orden</button></div>`}
if(q.type==='text'){content+=`<p class="small">Puedes escribir una palabra. Si lo necesitas, abre el banco de palabras.</p><label for="answer">Tu respuesta</label><input id="answer" type="text" autocomplete="off" value="${esc(s.value)}" ${s.done?'disabled':''}><div class="tools"><button class="primary" id="checktext" ${s.done?'disabled':''}>Comprobar</button><button id="bank" ${s.done?'disabled':''}>${s.bank?'Ocultar':'Ver'} banco de palabras</button></div>${s.bank?`<div class="choices">${q.opts.map((v,i)=>`<button data-bank="${i}" ${s.done?'disabled':''}>${esc(v)}</button>`).join('')}</div>`:''}`}
}
content+=`<div id="feedback" class="feedback ${s.feedback?(s.good?'good':'try'):''}" role="status" aria-live="polite">${esc(s.feedback)}</div><button id="hint" aria-expanded="${s.hint}">${s.hint?'Ocultar pista':'Necesito una pista'}</button>${s.hint?`<div class="hint"><b>Pista:</b> ${hintText(q)}${phase!==0&&q.visual?'<div class="visual" style="max-width:420px">'+q.visual+'</div>':''}</div>`:''}<div class="actions"><button id="prev" ${phase===0&&pos===1?'disabled':''}>← Anterior</button><button id="next" class="primary">${phase===3&&pos===p.data.length?'Ver mi progreso':pos===p.data.length?'Siguiente fase →':'Siguiente →'}</button></div>`;$('main').innerHTML=content;
$('main').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.done)return;let n=+b.dataset.choice;s.selected=n;let right=phase===0?q.answer:q.a;if(n===right){mark(phase===0?'¡Correcto! '+q.key:'¡Correcto! '+q.ex)}else fail('Todavía no. Lee la pista y vuelve a intentarlo.')});
$('main').querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{s.selected=+b.dataset.left;s.feedback='';render()});$('main').querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(s.selected===null){fail('Primero pulsa una palabra de la izquierda.');return}if(s.selected===+b.dataset.right){s.matched.push(s.selected);s.selected=null;if(s.matched.length===q.pairs.length)mark('¡Todas las parejas son correctas!');else {s.good=true;s.feedback='✓ Pareja correcta. Busca la siguiente.';render()}}else{fail('Esa pareja no coincide. Prueba otra opción.')}});
$('main').querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{s.sequence.push(+b.dataset.order);s.feedback='';render()});if($('undo'))$('undo').onclick=()=>{s.sequence.pop();s.feedback='';render()};if($('checkorder'))$('checkorder').onclick=()=>{if(s.sequence.every((v,i)=>v===i))mark('¡Orden correcto! '+q.ex);else fail('El orden no es correcto todavía. Deshaz los últimos pasos y prueba de nuevo.')};
if($('answer')){$('answer').oninput=e=>{s.value=e.target.value;save()};$('answer').onkeydown=e=>{if(e.key==='Enter')$('checktext').click()};$('checktext').onclick=()=>{if(q.answers.includes(norm(s.value)))mark('¡Correcto! '+q.ex);else fail('Revisa la palabra. Puedes usar la pista o el banco de palabras.')};$('bank').onclick=()=>{s.bank=!s.bank;render()};$('main').querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{s.value=q.opts[+b.dataset.bank];render();$('checktext').click()})}
$('hint').onclick=()=>{s.hint=!s.hint;render();$('hint').focus()};$('prev').onclick=()=>{if(index[phase]>0)index[phase]--;else if(phase>0){phase--;index[phase]=phases[phase].data.length-1}render(true)};$('next').onclick=()=>{if(index[phase]<p.data.length-1){index[phase]++;render(true)}else if(phase<3){phase++;index[phase]=0;render(true)}else showSummary()};save();if(focus){$('heading').focus({preventScroll:true});$('main').scrollIntoView({block:'start'})}}
function choiceMarkup(opts,s){return `<div class="choices">${opts.map((v,i)=>`<button data-choice="${i}" class="choice ${s.selected===i?(s.done?'correct':s.feedback?'incorrect':'selected'):''}" ${s.done?'disabled':''} aria-pressed="${s.selected===i}">${icons[v]||esc(v)}${s.selected===i&&s.done?' ✓':''}</button>`).join('')}</div>`}
function showSummary(){let total=completed.reduce((a,b)=>a+b.size,0),max=phases.reduce((a,b)=>a+b.data.length,0);$('main').innerHTML=`<h2 tabindex="-1" id="heading">Mi progreso</h2><p class="key">${total} de ${max} actividades completadas.</p><p>${total===max?'¡Has completado todas las fases!':'Puedes volver a las fases para completar las actividades que falten.'}</p><div class="grid">${phases.map((p,i)=>`<div class="tile"><h3>${p.name}</h3><p>${completed[i].size} de ${p.data.length} completadas</p><button data-return="${i}">Volver a esta fase</button></div>`).join('')}</div><h3>Recuerda las ideas importantes</h3><p>Corazón: bombea sangre. Arterias: salen. Venas: vuelven. Capilares: conectan. Plasma: transporta nutrientes. Glóbulos rojos: oxígeno. Glóbulos blancos: defensa. Plaquetas: ayudan a detener el sangrado.</p><button id="backreview" class="primary">Volver al repaso</button>`;$('main').querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{phase=+b.dataset.return;let first=phases[phase].data.findIndex((_,i)=>!completed[phase].has(i));index[phase]=first<0?0:first;render(true)});$('backreview').onclick=()=>{phase=3;index[3]=0;render(true)};$('heading').focus()}
$('size').onclick=()=>{document.body.classList.toggle('large');tabs();save()};$('contrast').onclick=()=>{document.body.classList.toggle('contrast');tabs();save()};$('reset').onclick=()=>{if(confirm('¿Quieres borrar el progreso y comenzar de nuevo?')){phase=0;index=[0,0,0,0];completed=phases.map(()=>new Set());tries={};local={};render(true)}};load();render();
</script></body></html>
