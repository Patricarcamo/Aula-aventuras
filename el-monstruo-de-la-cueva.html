function go(s){if(stage===3&&$('draw'))savedDrawing=$('draw').toDataURL();stage=s;index=0;solved=false;render()}
function renderNav(){ $('nav').replaceChildren();phases.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=dual(...p);if(i===stage)b.setAttribute('aria-current','step');b.onclick=()=>go(i);$('nav').append(b)})}
function render(){renderNav();const c=$('content');c.replaceChildren();if(stage===0){c.innerHTML=`<h2>${dual('MIRA Y LEE','Подивись і прочитай')}</h2>`;data.rows.forEach(([k,e,u])=>{let r=document.createElement('div');r.className='read';r.innerHTML=image(k)+`<div class="words">${dual(e,u)}</div>`;r.lastElementChild.append(sound(e,u));c.append(r)});let b=document.createElement('button');b.className='primary';b.innerHTML=dual('Practicar →','Далі');b.onclick=()=>go(1);c.append(b)}else if(stage===1||stage===2){quiz(c)}else draw(c)}
function quiz(c){let list=stage===1?vocab:comp;let n=list.length;if(index>=n){c.innerHTML=`<div class="finish"><h2>${dual('¡ACTIVIDAD TERMINADA!','Завдання виконано!')}</h2><p>${dual('Has completado todos los retos.','Ти виконав усі завдання.')}</p><div class="actions"><button id="again">↻ ${dual('Repetir','Повторити')}</button><button class="primary" id="forward">${dual('Siguiente fase →','Далі')}</button></div></div>`;$('again').onclick=()=>go(stage);$('forward').onclick=()=>go(stage+1);return}
let q=stage===1?{es:words[list[index][0]][0],uk:words[list[index][0]][1],opts:list[index][1],answer:list[index][0],type:'vocab'}:list[index];c.innerHTML=`<p class="note">${index+1} / ${n}</p><div class="track"><span style="width:${index/n*100}%"></span></div><div class="question"><h2>${dual(stage===1?'TOCA LA IMAGEN CORRECTA':q.type==='bool'?'¿ES VERDAD?':'ELIGE LA RESPUESTA',stage===1?'Натисни на правильне зображення':q.type==='bool'?'Це правда?':'Обери відповідь')}</h2>${q.img?image(q.img,'prompt'):''}<h3>${dual(q.es,q.uk)}</h3><div id="say"></div><div class="choices" id="options"></div><div id="feedback" class="feedback" role="status"></div></div><div class="actions"><button id="review">${dual('Consultar cuento','Перечитати')}</button><button id="next" class="primary" disabled>${dual('Siguiente →','Далі')}</button></div><div id="reviewbox" hidden></div>`;$('say').append(sound(q.es,q.uk));solved=false;
q.opts.forEach(k=>{let b=document.createElement('button');b.className='option';let bool=k==='yes'||k==='no';b.innerHTML=bool?dual(k==='yes'?'✓ SÍ':'✗ NO',k==='yes'?'ТАК':'НІ'):image(k)+(stage===1?'':dual(...words[k]));b.setAttribute('aria-label',bool?k==='yes'?'Sí / Так':'No / Ні':words[k].join(' / '));b.onclick=()=>{if(solved)return;if(k===q.answer){solved=true;b.classList.add('good');$('feedback').innerHTML=dual('¡MUY BIEN! ✓','ЧУДОВО! ✓');$('next').disabled=false;progress[stage]=Math.max(progress[stage],index+1);[...$('options').children].forEach(x=>x.disabled=x!==b)}else{b.classList.add('retry');$('feedback').innerHTML=dual('MIRA OTRA VEZ. PUEDES INTENTARLO.','Подивись ще раз. Спробуй ще.') }};$('options').append(b)});$('next').onclick=()=>{index++;render()};$('review').onclick=()=>{const r=$('reviewbox');r.hidden=!r.hidden;if(!r.hidden){r.replaceChildren();data.rows.forEach(([k,e,u])=>{let b=document.createElement('div');b.className='read';b.innerHTML=image(k)+`<div class="words">${dual(e,u)}</div>`;b.lastElementChild.append(sound(e,u));r.append(b)})}}}
function draw(c){c.innerHTML=`<h2>${dual('DIBUJA TU MONSTRUO','Намалюй своє чудовисько')}</h2><p>${dual('Recuerda: dos cuernos, cabeza grande y pies pequeños.','Пам’ятай: два роги, велика голова й маленькі ступні.')}</p><div class="toolbar">${image('horns','preview')}${image('feet','preview')}</div><p>${dual('ELIGE UN COLOR','Обери колір')}</p><div class="toolbar" id="colors"></div><p></p><canvas id="draw" width="1000" height="500" aria-label="Pizarra para dibujar"></canvas><div class="actions"><button id="erase">${dual('Borrar dibujo','Стерти малюнок')}</button><button id="done" class="primary">${dual('¡Terminé!','Готово!')}</button></div><p id="end" role="status"></p>`;let cv=$('draw'),ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=10;if(savedDrawing){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=savedDrawing}for(const [color,name]of [['#263e4e','Negro'],['#32856c','Verde'],['#c24646','Rojo'],['#8b572f','Marrón'],['#3a76bd','Azul'],['#e7ae36','Amarillo']]){let b=document.createElement('button');b.className='swatch';b.style.background=color;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',color===ink);b.onclick=()=>{ink=color;[...$('colors').children].forEach(x=>x.setAttribute('aria-pressed',x===b))};$('colors').append(b)}let drawing=false;const pos=e=>{let r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;cv.setPointerCapture(e.pointerId);let p=pos(e);ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.beginPath();ctx.arc(...p,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(...p)});cv.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,()=>drawing=false);$('erase').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);savedDrawing=null};$('done').onclick=()=>{$('end').innerHTML=dual('¡GENIAL! HAS TERMINADO TU DIBUJO.','ЧУДОВО! ТИ ЗАКІНЧИВ МАЛЮНОК.');savedDrawing=cv.toDataURL()}}
$('toggle').onclick=()=>{uk=!uk;$('app').classList.toggle('hideuk',!uk);$('toggle').setAttribute('aria-pressed',uk);$('toggle').textContent=uk?'🇺🇦 Ucraniano: visible':'🇺🇦 Mostrar ucraniano'};$('restart').onclick=()=>{savedDrawing=null;progress=[0,0,0,0];stage=0;go(0)};render();</script></body></html>
