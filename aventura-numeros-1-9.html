function feedback(t,good=false){let f=$('feedback');if(!f)return;f.textContent=t;f.className='feedback '+(good?'good':'try');say(t)}function success(t='¡Muy bien! Actividad conseguida.'){mark();feedback(t,true)}function hint(t){return `<div class="hint" ${help?'':'hidden'}>💡 ${t}</div>`}function btn(text,fn,cls=''){let b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.addEventListener('click',fn);return b}function mount(id,b){$(id).append(b);return b}function put(h){$('activity').innerHTML=h}function clearFeedback(){if($('feedback')){$('feedback').textContent='';$('feedback').className='feedback'}}
function showHome(){screen='home';main.innerHTML=`<section class="hero"><h1>¡Vamos a contar!</h1><p>Elige un número para aprender, jugar y escribir.</p><div class="numgrid" id="numgrid"></div><p class="sub">5 fases · 18 actividades por número · sin límite de tiempo</p></section><details><summary>Orientaciones para el aula</summary><p>Empieza por la cantidad y el reconocimiento. Después practica y juega con las funciones ejecutivas. Deja las series largas de escritura para el final. Las ayudas son opcionales. Se puede avanzar o repetir sin penalizaciones. El progreso se guarda en este navegador si está disponible.</p></details>`;for(let i=1;i<=9;i++){let b=btn('',()=>start(i),'numcard');b.innerHTML=`<strong>${i}</strong><span>${words[i]}</span><span class="dots">${'●'.repeat(i)}</span><small>${(completed[i]||[]).length}/18 actividades</small>`;b.setAttribute('aria-label',`Número ${i}, ${(completed[i]||[]).length} de 18 actividades`);$('numgrid').append(b)}}

const activities={
intro(){put(`<div class="rowflex"><div><div class="big">${n}</div><div class="word">${words[n]}</div></div><div><div id="objects" class="objects"></div><div id="counter" class="word">0 / ${n}</div></div></div>${hint('Toca cada dibujo una sola vez. Cada toque añade uno.')}`);let set=new Set();range(n).forEach(i=>{let b=obj(i,art[0],()=>{if(set.has(i))return;set.add(i);b.classList.add('selected');b.insertAdjacentHTML('beforeend',`<span class="tag">${set.size}</span>`);$('counter').textContent=set.size+' / '+n;if(set.size===n)success(`¡${words[n]}! Has contado todos.`);else say(String(set.size))},'','mariposa');mount('objects',b)})},
