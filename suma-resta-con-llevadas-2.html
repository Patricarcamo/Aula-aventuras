<style>

*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.app{max-width:960px;margin:0 auto;padding:16px 14px 48px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ef9b3e;outline-offset:3px}.hero{background:linear-gradient(115deg,#dff6ed 0%,#e9f5ff 58%,#ffecf2 100%);border:1px solid #dcece7;border-radius:24px;padding:19px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{font-size:clamp(23px,4.6vw,34px);letter-spacing:-.8px;margin:0 0 5px}.hero p{margin:0;color:#52657b;font-size:15px}.heroArt{font-size:clamp(29px,6vw,46px);white-space:nowrap}.topnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.navbtn{border:1px solid var(--border);border-radius:14px;background:white;color:var(--ink);padding:14px 8px;font-weight:800;font-size:15px;min-height:55px}.navbtn.active{background:#285d9a;color:white;border-color:#285d9a}.choose{background:white;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:19px;margin-top:14px;padding:15px}.choosehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.choosehead strong{font-size:16px}.count{font-size:13px;color:#42667b;background:#ecf6fa;border-radius:12px;padding:8px 11px;font-weight:800}.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:11px}.level{border:2px solid var(--border);background:white;text-align:left;border-radius:13px;padding:10px 11px;min-height:83px;color:var(--ink)}.level b{display:block;font-size:14px}.level small{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.3}.level.active{border-color:var(--blue);background:#ecf5ff}.stage{margin-top:16px;border-radius:21px;background:white;border:1px solid var(--border);padding:clamp(15px,3.4vw,24px);box-shadow:var(--shadow)}.sectiontop{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.sectiontop h2{margin:0;font-size:22px}.tag{background:#eff6ff;color:#255c95;border-radius:100px;font-size:12px;font-weight:800;padding:7px 10px}.subtitle{margin:8px 0 16px;color:var(--muted)}.switches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.switch{border:1px solid #b6ccdd;padding:9px 13px;background:#fff;color:#254b71;border-radius:13px;font-size:14px;font-weight:750}.switch.active{background:#e6f2ff;border-color:#3577bb}.lessonGrid,.practGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}.panel{border:1px solid var(--border);border-radius:17px;padding:16px;background:#fcfeff;min-width:0}.soft{background:#fff7ed;border-color:#ffdfbc}.mint{background:#edfbf5;border-color:#bfe9d7}.panel h3{font-size:18px;margin:0 0 12px}.vertical{background:#fff;border:1px solid #dbe6ee;border-radius:15px;max-width:260px;margin:5px auto;padding:14px 18px 12px}.place{display:grid;grid-template-columns:36px 58px 58px;justify-content:center;align-items:center;gap:4px;text-align:center}.place.head{color:#708197;font-size:12px;font-weight:900}.place.numbers{font-size:39px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}.op{color:#1d709f;font-size:32px}.rule{height:3px;max-width:150px;margin:7px auto;background:#45566c;border-radius:5px}.empty{visibility:hidden}.answerinput{width:53px;height:52px;text-align:center;border-radius:10px;border:2px solid #98bad5;color:#173c5b;background:#f3fbff;font-size:32px;font-weight:850}.answerinput:disabled{background:#dff7ed;border-color:#40997a;color:#146149}.visualrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.visualset{border:1px dashed #b9cee0;border-radius:13px;background:white;padding:10px;flex:1;min-width:140px}.visualset b{font-size:13px}.sticks{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.stick{height:37px;width:12px;background:#87cabb;border:1px solid #3d9b87;border-radius:4px}.dot{height:14px;width:14px;border-radius:50%;background:#ffbd6c;border:1px solid #e18c31;display:inline-block;margin:2px}.dots{display:flex;flex-wrap:wrap;align-items:center;max-width:190px}.mathline{font-size:23px;font-weight:900;text-align:center;margin:15px 0}.lessonbox{font-size:17px;line-height:1.6;min-height:138px}.stepcount{color:#526d87;font-size:13px;font-weight:800;margin-bottom:8px}.tip{border-left:5px solid #ffbc65;background:#fff6e7;border-radius:8px;padding:12px 13px;line-height:1.55;margin:14px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:13px;background:#2674bf;color:white;padding:12px 17px;min-height:45px;font-weight:800}.btn.secondary{background:#e7f1fb;color:#225882;border:1px solid #c6dced}.btn.green{background:#13815f}.btn:disabled{opacity:.45;cursor:default}.mini{font-size:13px}.helper{font-size:14px;line-height:1.5;color:#53677c}.fieldlabel{display:block;font-size:15px;font-weight:850;margin:10px 0 8px}.numberbox{width:132px;max-width:100%;font-weight:850;font-size:27px;border:2px solid #9fc6dd;border-radius:12px;padding:10px;text-align:center;background:white;color:#213b50}.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid #b7d9e8;background:#eff9ff;font-weight:760;line-height:1.55}.feedback.good{border-color:#a9dfc7;background:#e8f9ee;color:#15573d}.feedback.again{border-color:#f6d5a1;background:#fff7e8;color:#6f4d20}.wordproblem{background:#f5f0ff;border:1px solid #dfd3ff;border-radius:16px;padding:20px;font-size:clamp(18px,2.8vw,23px);line-height:1.7;font-weight:750}.wordproblem .emoji{font-size:34px;margin-bottom:7px}.optionrow{display:flex;flex-wrap:wrap;gap:9px}.option{padding:11px 15px;border:2px solid #c5d6e3;border-radius:12px;font-weight:800;background:white;color:var(--ink)}.option.selected{background:#e9f5ff;border-color:#2377bd}.readbtn{border:1px solid #9fbcd4;background:white;border-radius:12px;padding:8px 12px;color:#2b597b;font-weight:800}.footer{font-size:12px;line-height:1.55;color:#64748b;margin-top:14px;text-align:center}.stars{white-space:nowrap}.note{margin-top:9px;background:#eaf8f3;padding:10px 12px;border-radius:11px;color:#1e6752;font-size:14px;font-weight:750}.hidden{display:none!important}@media(max-width:700px){.app{padding:10px 9px 35px}.hero{padding:15px}.heroArt{font-size:26px}.navbtn{font-size:13px;padding:12px 4px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.level{min-height:67px}.lessonGrid,.practGrid{grid-template-columns:1fr}.panel{padding:13px}.lessonbox{min-height:0}.hero h1{font-size:25px}.stage{padding:14px}.wordproblem{padding:16px}.sectiontop h2{font-size:20px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s,border .12s,transform .12s}button:active{transform:scale(.985)}}

/* Casillas de llevadas y cuaderno de operaciones */
.carrycaption{font-size:13px;font-weight:800;color:#47657e;text-align:center;margin:2px 0 7px}
.place.carries{margin:3px 0 6px;min-height:43px}
.carryinput,.carryvalue{display:inline-flex;align-items:center;justify-content:center;width:48px;height:42px;max-width:100%;border:2px dashed #df9b51;border-radius:9px;background:#fff8eb;color:#744414;text-align:center;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.carryinput.double,.carryvalue.double{width:54px;font-size:19px}
.carryvalue.blank{color:#9aa6b5;background:#f8fafc;border-color:#d5e1e8}

.workdigit:disabled{background:#e4f7ee;color:#17704e}
.place.working{margin:4px 0;font-size:28px;font-weight:800}
.place.working .op{font-size:28px}

@media(max-width:400px){.worksheet{padding:10px}.vertical{padding:11px}.carryinput{width:44px}.workdigit{width:47px}}

<body>
<div class="app" id="mathapp">
<header class="hero"><div><h1>¡Contamos contigo! 🌈</h1><p>Sumas, restas y problemas · 2.º de Primaria</p></div><div class="heroArt" aria-hidden="true">🧮 ✏️</div></header>
<nav class="topnav" aria-label="Actividades"><button type="button" class="navbtn active" data-screen="learn">📖 Aprendo</button><button type="button" class="navbtn" data-screen="practice">🧩 Practico</button><button type="button" class="navbtn" data-screen="problems">🚀 Resuelvo problemas</button></nav>
<section class="choose" aria-label="Adaptar la dificultad"><div class="choosehead"><strong>Elige cómo quieres aprender</strong><span class="count" id="counter" aria-live="polite">⭐ 0 actividades conseguidas</span></div><div class="levels" id="levels"><button class="level" data-level="base"><b>🌱 Me preparo</b><small>Decenas, unidades y sin llevada</small></button><button class="level active" data-level="ayuda"><b>🤝 Con ayuda</b><small>Con llevada, números sencillos</small></button><button class="level" data-level="solo"><b>💪 Lo intento</b><small>Dos cifras y con llevada</small></button><button class="level" data-level="reto"><b>⭐ Me supero</b><small>Más retos y problemas de dos pasos</small></button></div></section>
<main id="content" class="stage"></main>
<p class="footer">Sin cronómetro ni penalizaciones. Puedes repetir, usar pistas y cambiar de nivel cuando quieras. Funciona sin conexión a Internet.</p>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const state={screen:'learn',level:'ayuda',op:'add',lessonStep:0,question:null,lastKey:'',hint:0,visual:true,feedback:'',feedbackKind:'',completed:0,done:false,selection:'',story:null,practiceFields:{},work:{},storyAnswer:''};
const rnd=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const digit=(n,place)=>place==='t'?Math.floor(n/10):n%10;
const labelLevel={base:'Me preparo',ayuda:'Con ayuda',solo:'Lo intento',reto:'Me supero'};
const storySets={
base:[
{emoji:'🖍️',text:'Ana tiene 23 pinturas. Le dan 4 pinturas más. ¿Cuántas pinturas tiene ahora?',op:'add',a:23,b:4,answer:27,h1:'Le dan más. ¿Juntamos o quitamos?',h2:'Calcula 23 + 4.'},
{emoji:'🍎',text:'Hay 36 manzanas. Se comen 3. ¿Cuántas quedan?',op:'sub',a:36,b:3,answer:33,h1:'Se comen algunas. ¿Juntamos o quitamos?',h2:'Calcula 36 − 3.'},
{emoji:'🚗',text:'En un aparcamiento hay 42 coches. Llegan 5 más. ¿Cuántos hay?',op:'add',a:42,b:5,answer:47,h1:'Llegan coches. ¿Qué operación usamos?',h2:'Calcula 42 + 5.'},
{emoji:'🎈',text:'Pablo tiene 58 globos. Regala 6. ¿Cuántos le quedan?',op:'sub',a:58,b:6,answer:52,h1:'Regala globos. ¿Qué operación usamos?',h2:'Calcula 58 − 6.'}],
ayuda:[
{emoji:'⭐',text:'Nora tiene 18 pegatinas. Su amiga le da 5 más. ¿Cuántas tiene ahora?',op:'add',a:18,b:5,answer:23,h1:'Cuando llegan más, sumamos.',h2:'Calcula 18 + 5. ¡Hay cambio de decena!'},
{emoji:'✏️',text:'En una caja hay 32 lápices. Sacamos 7. ¿Cuántos quedan?',op:'sub',a:32,b:7,answer:25,h1:'Si sacamos lápices, restamos.',h2:'Calcula 32 − 7. Cambia una decena por unidades.'},
{emoji:'🐠',text:'En el acuario hay 27 peces. Nacen 6 más. ¿Cuántos hay ahora?',op:'add',a:27,b:6,answer:33,h1:'Nacen más peces. Tenemos que sumar.',h2:'Calcula 27 + 6.'},
{emoji:'🍪',text:'Hay 43 galletas. Comemos 8. ¿Cuántas quedan?',op:'sub',a:43,b:8,answer:35,h1:'Comemos algunas. Tenemos que restar.',h2:'Calcula 43 − 8.'}],
solo:[
{emoji:'📚',text:'En la biblioteca hay 28 cuentos. Llegan 16 nuevos. ¿Cuántos hay?',op:'add',a:28,b:16,answer:44,h1:'Llegan cuentos, así que sumamos.',h2:'Calcula 28 + 16.'},
{emoji:'🎫',text:'Había 52 entradas. Se vendieron 17. ¿Cuántas quedan?',op:'sub',a:52,b:17,answer:35,h1:'Se vendieron entradas, así que restamos.',h2:'Calcula 52 − 17.'},
{emoji:'🌼',text:'En un jardín hay 37 flores. Plantamos 25 más. ¿Cuántas hay?',op:'add',a:37,b:25,answer:62,h1:'Plantamos más flores. Sumamos.',h2:'Calcula 37 + 25.'},
{emoji:'⚽',text:'El cole tenía 73 balones. Presta 28. ¿Cuántos quedan?',op:'sub',a:73,b:28,answer:45,h1:'Prestar balones significa quitar.',h2:'Calcula 73 − 28.'}],
reto:[
{emoji:'🧩',text:'Tenemos 28 piezas. Nos regalan 16 y usamos 9. ¿Cuántas piezas quedan?',op:'add-sub',answer:35,steps:[{a:28,b:16,op:'add',answer:44},{a:44,b:9,op:'sub',answer:35}],h1:'Primero llegan piezas y después se usan.',h2:'Primero 28 + 16 = 44. Después 44 − 9.'},
{emoji:'🌻',text:'Había 64 semillas. Plantamos 27 y compramos 18 más. ¿Cuántas tenemos al final?',op:'sub-add',answer:55,steps:[{a:64,b:27,op:'sub',answer:37},{a:37,b:18,op:'add',answer:55}],h1:'Primero quitamos las plantadas y después añadimos.',h2:'Primero 64 − 27 = 37. Después 37 + 18.'},
{emoji:'📘',text:'La clase tiene 37 libros. Recibe 28 y presta 19. ¿Cuántos libros quedan?',op:'add-sub',answer:46,steps:[{a:37,b:28,op:'add',answer:65},{a:65,b:19,op:'sub',answer:46}],h1:'Recibimos libros y luego prestamos.',h2:'Primero 37 + 28 = 65. Después 65 − 19.'},
{emoji:'🐦',text:'En un árbol había 82 pájaros. Vuelan 35 y llegan 26. ¿Cuántos hay ahora?',op:'sub-add',answer:73,steps:[{a:82,b:35,op:'sub',answer:47},{a:47,b:26,op:'add',answer:73}],h1:'Primero se marchan y después llegan.',h2:'Primero 82 − 35 = 47. Después 47 + 26.'}]
};
const symbol=op=>op==='add'?'+':'−';
function getLesson(){
if(state.level==='base')return state.op==='add'?{a:24,b:3,steps:['Primero colocamos las decenas (D) y las unidades (U).','Sumamos las unidades: 4 + 3 = 7. No hace falta cambiar una decena.','Sumamos las decenas: 2 + 0 = 2.','¡Muy bien! 24 + 3 = 27.']}:{a:46,b:4,steps:['Colocamos las decenas y unidades en columnas.','Restamos las unidades: 6 − 4 = 2.','Restamos las decenas: 4 − 0 = 4.','¡Muy bien! 46 − 4 = 42.']};
if(state.op==='add')return state.level==='ayuda'?{a:27,b:5,steps:['Colocamos D debajo de D y U debajo de U.','Empezamos por las unidades: 7 + 5 = 12. Escribimos 2 unidades y llevamos 1 decena.','Sumamos las decenas: 2 + 0 + 1 que llevamos = 3.','¡Ya está! 27 + 5 = 32.']}:{a:27,b:15,steps:['Colocamos D debajo de D y U debajo de U.','Empezamos por las unidades: 7 + 5 = 12. Escribimos 2 unidades y llevamos 1 decena.','Sumamos las decenas: 2 + 1 + 1 que llevamos = 4.','¡Ya está! 27 + 15 = 42.']};
return state.level==='ayuda'?{a:43,b:8,steps:['Colocamos las unidades bajo las unidades y las decenas bajo las decenas.','No podemos quitar 8 unidades a 3. Cambiamos 1 decena por 10 unidades: ahora tenemos 13.','Restamos las unidades: 13 − 8 = 5. Quedan 3 decenas: 3 − 0 = 3.','¡Conseguido! 43 − 8 = 35.']}:{a:43,b:18,steps:['Colocamos las unidades bajo las unidades y las decenas bajo las decenas.','No podemos quitar 8 unidades a 3. Cambiamos 1 decena por 10 unidades: ahora tenemos 13.','Restamos las unidades: 13 − 8 = 5. Quedan 3 decenas y restamos 1: 3 − 1 = 2.','¡Conseguido! 43 − 18 = 25.']};
}
function blocks(n,name){let tens=digit(n,'t'),ones=digit(n,'u');return `<div class="visualset" aria-label="${name}: ${tens} decenas y ${ones} unidades"><b>${name}: ${n} = ${tens} D + ${ones} U</b><div class="sticks" aria-hidden="true">${'<span class="stick"></span>'.repeat(tens)}</div><div class="dots" aria-hidden="true">${'<span class="dot"></span>'.repeat(ones)}</div></div>`;}
function visual(a,b){return `<div class="visualrow">${blocks(a,'Primer número')}${blocks(b,'Segundo número')}</div><div class="helper" style="margin-top:8px">🟩 Cada barra representa una decena. 🟠 Cada punto representa una unidad.</div>`;}
function carried(a,b,op){const ua=a%10,ub=b%10,ta=Math.floor(a/10);if(op==='add')return {needed:ua+ub>=10,d:'1',u:''};return {needed:ua<ub,d:String(ta-1),u:String(ua+10)};}
function fieldInput(key,place,area='practice',max=1,disabled=false){const store=area==='practice'?state.practiceFields:state.work;const val=store[key]||'';const label=area==='practice'?(place==='D'?'Decenas':'Unidades'):`${key.replaceAll('_',' ')}, ${place==='D'?'decenas':'unidades'}`;return `<input type="text" class="${area==='practice'?'answerinput':'workdigit'}" aria-label="${label}" data-area="${area}" data-digitkey="${key}" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="${max}" value="${val}" ${disabled?'disabled':''}>`;}
function carryBox(key,area,max,disabled,value=''){if(area==='lesson')return `<span class="carryvalue ${value?'':'blank'} ${max===2?'double':''}" aria-label="${value?'Cantidad llevada '+value:'Casilla para llevada'}">${value||'·'}</span>`;const store=area==='practice'?state.practiceFields:state.work;const val=store[key]||'';return `<input type="text" class="carryinput ${max===2?'double':''}" aria-label="${max===2?'Unidades tras cambiar una decena':'Llevada o decenas tras prestar'}" data-area="${area}" data-digitkey="${key}" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="${max}" value="${val}" ${disabled?'disabled':''}>`;}
function vertical(a,b,op,editable=false,done=false){const da=digit(a,'t'),db=digit(b,'t'),ua=digit(a,'u'),ub=digit(b,'u'),c=carried(a,b,op);const area=editable?'practice':'lesson';const show=!editable&&state.lessonStep>=2&&state.level!=='base'&&c.needed;const dBox=carryBox('carryD',area,1,done,show?c.d:'');const uBox=op==='sub'?carryBox('carryU',area,2,done,show?c.u:''):'<span></span>';return `<div class="vertical" aria-label="Operación en columnas"><div class="carrycaption">${op==='add'?'✏️ Casilla de la llevada':'✏️ Casillas del cambio de decena'}</div><div class="place head"><span></span><span>D</span><span>U</span></div><div class="place carries"><span></span><span>${dBox}</span><span>${uBox}</span></div><div class="place numbers"><span></span><span>${da||'<span class="empty">0</span>'}</span><span>${ua}</span></div><div class="place numbers"><span class="op">${symbol(op)}</span><span>${db||'<span class="empty">0</span>'}</span><span>${ub}</span></div><div class="rule"></div><div class="place numbers"><span></span>${editable?`${fieldInput('answerT','D','practice',1,done)}${fieldInput('answerU','U','practice',1,done)}`:'<span>?</span><span>?</span>'}</div>${editable?`<div class="carryhint">${!c.needed?'Si no hay llevada, deja la casilla vacía.':op==='add'?'Si sumas 10 o más unidades, escribe el 1 en la casilla naranja.':'Escribe arriba las nuevas decenas y las unidades tras cambiar una decena.'}</div>`:''}</div>`;}
function bindDigitFields(){document.querySelectorAll('[data-digitkey]').forEach(el=>el.addEventListener('input',()=>{const value=el.value.replace(/\D/g,'').slice(0,Number(el.maxLength));el.value=value;const obj=el.dataset.area==='practice'?state.practiceFields:state.work;obj[el.dataset.digitkey]=value;}));}

function setContent(html){$('#content').innerHTML=html;}
function notice(){if(!state.feedback)return '';return `<div class="feedback ${state.feedbackKind}" role="status" aria-live="polite">${state.feedback}</div>`;}
function renderLesson(){let ex=getLesson();let step=state.lessonStep;setContent(`<div class="sectiontop"><h2>📖 Aprendo paso a paso</h2><span class="tag">${labelLevel[state.level]}</span></div><p class="subtitle">Mira qué ocurre en cada columna. Puedes repetir las veces que necesites.</p><div class="switches"><button class="switch ${state.op==='add'?'active':''}" data-op="add">➕ Suma</button><button class="switch ${state.op==='sub'?'active':''}" data-op="sub">➖ Resta</button></div><div class="lessonGrid"><div class="panel"><h3>Así colocamos los números</h3>${vertical(ex.a,ex.b,state.op)}<div class="mathline">${ex.a} ${symbol(state.op)} ${ex.b}</div>${step===3?`<div class="note">🎉 Resultado: <strong>${state.op==='add'?ex.a+ex.b:ex.a-ex.b}</strong></div>`:''}</div><div class="panel mint"><h3>Descubrimos la estrategia</h3><div class="stepcount">Paso ${step+1} de 4</div><div class="lessonbox">${ex.steps[step]}</div>${step===1&&state.level!=='base'?`<div class="tip">${state.op==='add'?'🪄 <b>Truco:</b> 10 unidades se convierten en 1 decena.':'🪄 <b>Truco:</b> una decena puede convertirse en 10 unidades.'}</div>`:''}<div class="actions"><button class="btn secondary" id="prev" ${step===0?'disabled':''}>← Anterior</button><button class="btn" id="next">${step===3?'Volver a empezar':'Siguiente paso →'}</button></div></div></div><div class="panel" style="margin-top:14px"><div class="sectiontop"><h3 style="margin:0">🧱 Las decenas y las unidades</h3><button class="readbtn" id="speakLesson">🔊 Escuchar</button></div>${visual(ex.a,ex.b)}<div class="actions"><button class="btn green" id="toPractice">¡Quiero practicar! →</button></div></div>`);
$('#prev').onclick=()=>{state.lessonStep=Math.max(0,state.lessonStep-1);render()};$('#next').onclick=()=>{state.lessonStep=(state.lessonStep+1)%4;render()};$('#speakLesson').onclick=()=>speak(ex.steps[step]);$('#toPractice').onclick=()=>switchScreen('practice');bindOps();}
function newEquation(){let op=state.op==='mix'?(Math.random()<.5?'add':'sub'):state.op;if(state.level==='base')op=state.op==='mix'?(Math.random()<.5?'add':'sub'):state.op;let a,b;for(let k=0;k<2000;k++){if(state.level==='base'){a=rnd(21,86);b=rnd(2,8);if(op==='add'&&digit(a,'u')+b<=9&&a+b<=99||op==='sub'&&digit(a,'u')>=b)break;}else if(state.level==='ayuda'){a=rnd(21,48);b=rnd(2,9);if(op==='add'&&digit(a,'u')+b>=10&&a+b<=59||op==='sub'&&digit(a,'u')<b)break;}else {a=op==='add'?rnd(21,73):rnd(41,98);b=op==='add'?rnd(12,65):rnd(11,Math.min(75,a-1));if(op==='add'&&a+b<=99&&digit(a,'u')+digit(b,'u')>=10||op==='sub'&&a>b&&digit(a,'u')<digit(b,'u'))break;}}if(a===undefined){a=28;b=16;op='add';}return {a,b,op,answer:op==='add'?a+b:a-b};}
function resetEquation(){let q;for(let i=0;i<10;i++){q=newEquation();if(`${q.a}${q.op}${q.b}`!==state.lastKey)break;}state.question=q;state.lastKey=`${q.a}${q.op}${q.b}`;state.done=false;state.hint=0;state.feedback='';state.practiceFields={};state.visual=state.level==='base'||state.level==='ayuda';render();}
function equationHint(q){const a=q.a,b=q.b,ua=digit(a,'u'),ub=digit(b,'u'),ta=digit(a,'t'),tb=digit(b,'t');if(q.op==='add'){if(state.level==='base')return ['Empieza sumando las unidades.','Unidades: '+ua+' + '+ub+' = '+(ua+ub)+'.','Decenas: '+ta+' + '+tb+' = '+(ta+tb)+'.'];return ['Empieza por las unidades. ¿Qué sucede si pasas de 9?','Unidades: '+ua+' + '+ub+' = '+(ua+ub)+'. Escribe '+((ua+ub)%10)+' y lleva 1 decena.','Decenas: '+ta+' + '+tb+' + 1 que llevas = '+(ta+tb+1)+'.'];}if(state.level==='base')return ['Empieza restando las unidades.','Unidades: '+ua+' − '+ub+' = '+(ua-ub)+'.','Decenas: '+ta+' − '+tb+' = '+(ta-tb)+'.'];return ['Empieza por las unidades. Si no alcanza, cambia una decena por 10 unidades.','Cambiamos 1 decena: '+(ua+10)+' − '+ub+' = '+(ua+10-ub)+' unidades.','Queda 1 decena menos arriba: '+(ta-1)+' − '+tb+' = '+(ta-1-tb)+' decenas.'];}
function renderPractice(){let q=state.question;if(!q){state.question=newEquation();q=state.question;}let hints=equationHint(q);setContent(`<div class="sectiontop"><h2>🧩 Practico operaciones</h2><span class="tag">${labelLevel[state.level]}</span></div><p class="subtitle">Resuelve a tu ritmo. Apunta la llevada en el <b>recuadro naranja</b> y escribe el resultado en decenas y unidades.</p><div class="switches"><button class="switch ${state.op==='add'?'active':''}" data-op="add">➕ Sumas</button><button class="switch ${state.op==='sub'?'active':''}" data-op="sub">➖ Restas</button><button class="switch ${state.op==='mix'?'active':''}" data-op="mix">🎲 Mezcladas</button></div><div class="practGrid"><div class="panel"><h3>Completa la operación</h3>${vertical(q.a,q.b,q.op,true,state.done)}<div class="helper" style="text-align:center">D = decenas · U = unidades</div>${state.done?`<div class="note">✅ ${q.a} ${symbol(q.op)} ${q.b} = ${q.answer}</div>`:''}<div class="actions" style="justify-content:center"><button class="btn green" id="checkEquation" ${state.done?'disabled':''}>Comprobar ✓</button><button class="btn secondary" id="newEquation">Otra operación →</button></div>${notice()}</div><div class="panel soft"><h3>🌟 Ayudas cuando las necesites</h3><p class="helper">Puedes usar pistas o bloques. Aprender es intentarlo, no hacerlo rápido.</p><div class="actions"><button class="btn secondary" id="hintEquation">💡 Dame una pista</button><button class="btn secondary" id="toggleBlocks">🧱 ${state.visual?'Ocultar':'Ver'} bloques</button></div>${state.hint>0?`<div class="tip">${hints[Math.min(state.hint,3)-1]}</div>`:''}${state.visual?visual(q.a,q.b):`<div class="note">Recuerda: 10 unidades = 1 decena.</div>`}</div></div>`);
if(state.done){state.practiceFields.answerT=String(Math.floor(q.answer/10));state.practiceFields.answerU=String(q.answer%10);document.querySelector('[data-digitkey="answerT"]').value=state.practiceFields.answerT;document.querySelector('[data-digitkey="answerU"]').value=state.practiceFields.answerU;}$('#checkEquation').onclick=checkEquation;$('#newEquation').onclick=resetEquation;$('#hintEquation').onclick=()=>{state.hint=Math.min(3,state.hint+1);render()};$('#toggleBlocks').onclick=()=>{state.visual=!state.visual;render();};bindDigitFields();bindOps();document.querySelectorAll('[data-digitkey]').forEach(el=>{el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!state.done)checkEquation()})});}

function checkEquation(){if(state.done)return;const t=state.practiceFields.answerT||'',u=state.practiceFields.answerU||'',q=state.question;if(!/^\d$/.test(t)||!/^\d$/.test(u)){state.feedback='✏️ Escribe una cifra en D y otra en U. Si necesitas ayuda, pulsa «Dame una pista».';state.feedbackKind='again';return updateEquationFeedback();}const tens=Number(t),ones=Number(u),et=Math.floor(q.answer/10),eu=q.answer%10,c=carried(q.a,q.b,q.op);if(tens!==et||ones!==eu){state.feedbackKind='again';state.feedback=ones!==eu?'🔎 Revisa primero la columna de las unidades. Puedes ayudarte con los bloques o con una pista.':'👏 ¡Las unidades están bien! Revisa las decenas y recuerda si llevas o has cambiado una decena.';return updateEquationFeedback();}if(c.needed){if((state.practiceFields.carryD||'')!==c.d){state.feedback='🟧 El resultado está bien. Completa la casilla naranja de D para anotar correctamente la llevada.';state.feedbackKind='again';return updateEquationFeedback();}if(q.op==='sub'&&(state.practiceFields.carryU||'')!==c.u){state.feedback='🟧 Anota también las nuevas unidades (después de cambiar una decena) en la casilla naranja de U.';state.feedbackKind='again';return updateEquationFeedback();}}state.done=true;state.completed++;state.feedback='🎉 ¡Genial! Has colocado las decenas, las unidades y la llevada correctamente.';state.feedbackKind='good';render();updateCounter();}

function updateEquationFeedback(){const old=$('#content .feedback');if(old)old.remove();$('#checkEquation').parentElement.insertAdjacentHTML('afterend',notice());}
function nextStory(){let stories=storySets[state.level],q;if(state.story){let cur=stories.indexOf(state.story);q=stories[(cur+1)%stories.length]}else q=stories[0];state.story=q;state.selection='';state.done=false;state.hint=0;state.feedback='';state.work={};state.storyAnswer='';render();}
function storySheet(step,i,selected,done){const prefix=`p${i}_`,single=i===0;const c=carried(step.a,step.b,step.op);const chosen=state.selection?state.selection.split('-')[i]:null;const sign=chosen?symbol(chosen):'?';const input=(pos,place,max=1)=>fieldInput(prefix+pos+place,place,'story',max,done);return `<div class="worksheet"><h4>${single?'🧮 Primera operación':'🧮 Segunda operación'}</h4><div class="vertical" aria-label="Espacio de operación ${i+1}"><div class="carrycaption">✏️ Apunto las llevadas</div><div class="place head"><span></span><span>D</span><span>U</span></div><div class="place carries"><span></span><span>${carryBox(prefix+'carryD','story',1,done)}</span><span>${carryBox(prefix+'carryU','story',2,done)}</span></div><div class="place working"><span></span>${input('a','D')}${input('a','U')}</div><div class="place working"><span class="op">${sign}</span>${input('b','D')}${input('b','U')}</div><div class="rule"></div><div class="place working"><span></span>${input('r','D')}${input('r','U')}</div></div><div class="carryhint">Escribe cada número en D y U. Las casillas naranjas son para las llevadas.${c.needed?' Si las necesitas, úsalas.':''}</div></div>`;}
function storySteps(q){return q.steps||[{a:q.a,b:q.b,op:q.op,answer:q.answer}];}
function renderProblems(){if(!state.story||!storySets[state.level].includes(state.story))state.story=storySets[state.level][0];const q=state.story,isMulti=!!q.steps;const opts=isMulti?[['add-sub','➕ y después ➖'],['sub-add','➖ y después ➕']]:[['add','➕ Sumar'],['sub','➖ Restar']];const selected=!!state.selection;setContent(`<div class="sectiontop"><h2>🚀 Resuelvo problemas</h2><span class="tag">${labelLevel[state.level]}</span></div><p class="subtitle">Lee el problema, elige la operación, <b>coloca tú los números en las casillas</b> y calcula.</p><div class="wordproblem"><div class="emoji" aria-hidden="true">${q.emoji}</div>${q.text}</div><div class="actions"><button class="readbtn" id="readProblem">🔊 Escuchar el problema</button><button class="readbtn" id="helpStory">💡 ${state.hint>=2?'Repetir pista':'Pista'}</button></div>${state.hint?`<div class="tip">${state.hint===1?q.h1:q.h2}</div>`:''}<div class="panel workarea"><h3>1. Elijo la operación</h3><div class="optionrow">${opts.map(([v,t])=>`<button class="option ${state.selection===v?'selected':''}" data-choice="${v}" ${state.done?'disabled':''}>${t}</button>`).join('')}</div><div class="helper" style="margin-top:10px">${isMulti?'Este problema se resuelve en dos pasos.':'Piensa si la cantidad aumenta o disminuye.'}</div></div><div class="panel workarea"><h3>2. Coloco los números y hago la operación</h3><div class="work-instruction">✍️ Pulsa las casillas azules para escribir los números. Empieza por las unidades (U). Utiliza las casillas naranjas para apuntar las llevadas. Si un número solo tiene unidades, puedes dejar su decena vacía.</div><div class="worksteps ${isMulti?'two':''}">${storySteps(q).map((step,i)=>storySheet(step,i,selected,state.done)).join('')}</div></div><div class="final-answer"><h3>3. Escribo la respuesta del problema</h3><label class="fieldlabel" for="storyAnswer">¿Cuánto hay al final?</label><input id="storyAnswer" class="numberbox" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="${state.storyAnswer}" ${state.done?'disabled':''}><div class="actions"><button class="btn green" id="checkProblem" ${state.done?'disabled':''}>Comprobar ✓</button><button class="btn secondary" id="otherStory">Otro problema →</button></div>${notice()}</div>${state.done?`<div class="note">✅ ¡Lo has conseguido! La solución es <b>${q.answer}</b>.</div>`:''}`);
$('#readProblem').onclick=()=>speak(q.text);$('#helpStory').onclick=()=>{state.hint=Math.min(2,state.hint+1);render();};$('#otherStory').onclick=nextStory;$('#checkProblem').onclick=checkProblem;document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{state.selection=el.dataset.choice;render();});$('#storyAnswer').oninput=el=>{state.storyAnswer=el.target.value.replace(/\D/g,'').slice(0,3);el.target.value=state.storyAnswer;};$('#storyAnswer').addEventListener('keydown',e=>{if(e.key==='Enter')checkProblem()});bindDigitFields();}
function readWorkNumber(key){const d=state.work[key+'D']||'',u=state.work[key+'U']||'';if(!/^\d$/.test(u)||(d!==''&&!/^\d$/.test(d)))return null;return (d?Number(d):0)*10+Number(u);}

function checkProblem(){if(state.done)return;const val=state.storyAnswer.trim(),q=state.story;if(!state.selection){state.feedback='👀 Primero elige la operación que necesitas.';state.feedbackKind='again';return updateStoryFeedback();}if(state.selection!==q.op){state.feedback='💡 Piensa qué ocurre primero en la historia. Lee otra vez o pulsa «Pista».';state.feedbackKind='again';return updateStoryFeedback();}for(const [i,step] of storySteps(q).entries()){const prefix=`p${i}_`;const a=readWorkNumber(prefix+'a'),b=readWorkNumber(prefix+'b'),result=readWorkNumber(prefix+'r');if(a===null||b===null||result===null){state.feedback=`✏️ Completa los números y el resultado de la ${i===0?'primera':'segunda'} operación, colocando cada cifra en D y U.`;state.feedbackKind='again';return updateStoryFeedback();}if(a!==step.a||b!==step.b){state.feedback=`🔎 Revisa las cantidades que has colocado en la ${i===0?'primera':'segunda'} operación. Léelas de nuevo en el enunciado.`;state.feedbackKind='again';return updateStoryFeedback();}if(result!==step.answer){state.feedback=`🧮 Revisa el cálculo de la ${i===0?'primera':'segunda'} operación. Puedes apuntar las llevadas en las casillas naranjas.`;state.feedbackKind='again';return updateStoryFeedback();}}if(!/^\d{1,3}$/.test(val)){state.feedback='✏️ Escribe el número que responde a la pregunta.';state.feedbackKind='again';return updateStoryFeedback();}if(Number(val)!==q.answer){state.feedback='🔍 Las operaciones están bien, pero revisa la respuesta final.';state.feedbackKind='again';return updateStoryFeedback();}state.done=true;state.completed++;state.feedback='🎉 ¡Problema resuelto! Has colocado las cifras, realizado las operaciones y respondido muy bien.';state.feedbackKind='good';render();updateCounter();}

function updateStoryFeedback(){const old=$('#content .feedback');if(old)old.remove();$('#checkProblem').parentElement.insertAdjacentHTML('afterend',notice());}
function bindOps(){document.querySelectorAll('[data-op]').forEach(el=>el.onclick=()=>{state.op=el.dataset.op;state.lessonStep=0;state.question=null;state.hint=0;state.done=false;state.feedback='';if(state.screen==='practice')resetEquation();else render();});}
function switchScreen(s){state.screen=s;state.op='add';state.lessonStep=0;state.question=null;state.feedback='';state.hint=0;state.done=false;state.story=null;state.practiceFields={};state.work={};state.storyAnswer='';state.selection='';render();}
function updateCounter(){$('#counter').textContent=`⭐ ${state.completed} ${state.completed===1?'actividad conseguida':'actividades conseguidas'}`;}
function speak(text){if(!('speechSynthesis' in window)){alert('La lectura en voz alta no está disponible en este navegador.');return;}try{window.speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(text);msg.lang='es-ES';msg.rate=.87;window.speechSynthesis.speak(msg)}catch(_){alert('No se pudo iniciar la lectura en voz alta.')}}
function render(){document.querySelectorAll('[data-screen]').forEach(el=>{let active=el.dataset.screen===state.screen;el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false')});document.querySelectorAll('[data-level]').forEach(el=>{const active=el.dataset.level===state.level;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});if(state.screen==='learn')renderLesson();else if(state.screen==='practice')renderPractice();else renderProblems();}
document.querySelectorAll('[data-screen]').forEach(el=>el.onclick=()=>switchScreen(el.dataset.screen));document.querySelectorAll('[data-level]').forEach(el=>el.onclick=()=>{state.level=el.dataset.level;state.lessonStep=0;state.question=null;state.story=null;state.hint=0;state.done=false;state.feedback='';state.practiceFields={};state.work={};state.storyAnswer='';state.selection='';if(state.op==='mix'&&state.screen==='learn')state.op='add';render()});
updateCounter();render();
})();
</script>
</body>
</html>
